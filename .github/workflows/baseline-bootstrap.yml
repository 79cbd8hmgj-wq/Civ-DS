name: Civ Rev Baseline Bootstrap

on:
  push:
    branches:
      - feature/civrev-baseline

permissions:
  contents: write

jobs:
  baseline:
    if: ${{ !contains(github.event.head_commit.message, '[baseline-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/civrev-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Generate safe baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          OUT_ROM="$RUNNER_TEMP/CivRev-roundtrip.nds"
          mkdir -p "$ROM_DIR" evidence/baseline profiles
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"

          civds profile create "$ROM" --id civrev-usa --output profiles/civrev-us.json
          civds inspect "$ROM" --output evidence/baseline/rom-inspection.json
          civds assets inventory "$ROM" --include-unknown --output evidence/baseline/assets.json

          python - "$ROM" <<'PY'
          import json
          import struct
          import sys
          from pathlib import Path
          from nds_disassembly_toolkit.inspection import inspect_rom
          from nds_disassembly_toolkit.disassembly import MODULE_PARAMS_MAGIC, MODULE_PARAMS_MAGIC_OFFSET, MODULE_PARAMS_SIZE

          rom_path = Path(sys.argv[1])
          inspection = inspect_rom(rom_path)
          rom = rom_path.read_bytes()
          start = inspection.header.arm9_offset
          arm9 = rom[start:start + inspection.header.arm9_size]
          magic = struct.pack('<I', MODULE_PARAMS_MAGIC)
          candidates = []
          cursor = 0
          while True:
              magic_offset = arm9.find(magic, cursor)
              if magic_offset < 0:
                  break
              block_start = magic_offset - MODULE_PARAMS_MAGIC_OFFSET
              if block_start >= 0 and block_start % 4 == 0 and block_start + MODULE_PARAMS_SIZE <= len(arm9):
                  values = struct.unpack_from('<8I', arm9, block_start)
                  candidates.append({
                      'offset': block_start,
                      'address': inspection.header.arm9_ram_address + block_start,
                      'autoload_list_start': values[0],
                      'autoload_list_end': values[1],
                      'autoload_start': values[2],
                      'static_bss_start': values[3],
                      'static_bss_end': values[4],
                      'compressed_static_end': values[5],
                      'sdk_version': values[6],
                  })
              cursor = magic_offset + 1
          print('MODULE_PARAM_CANDIDATES=' + json.dumps(candidates, sort_keys=True))
          PY

          civds disasm overlay-map "$ROM" --output evidence/baseline/overlay-map.json
          civds extract "$ROM" "$WORK_DIR"

          cp "$WORK_DIR/manifests/workspace.json" evidence/baseline/workspace.json
          cp "$WORK_DIR/manifests/files.json" evidence/baseline/files.json
          cp "$WORK_DIR/manifests/overlays.json" evidence/baseline/overlays.json

          civds rebuild "$ROM" "$WORK_DIR" "$OUT_ROM"
          cp "${OUT_ROM}.build.json" evidence/baseline/rebuild-report.json
          civds inspect "$OUT_ROM" --allow-unsupported --output evidence/baseline/roundtrip-inspection.json
      - name: Commit metadata-only evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiles/civrev-us.json evidence/baseline
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: add Civ Rev baseline evidence [baseline-generated]"
          git push origin HEAD:feature/civrev-baseline
