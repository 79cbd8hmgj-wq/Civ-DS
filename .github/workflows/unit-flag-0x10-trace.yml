name: Civ Rev unit flag 0x10 trace

on:
  push:
    branches:
      - analysis/civrev-unit-survey
    paths:
      - .github/workflows/unit-flag-0x10-trace.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Trace only the 0x10 unit-flag routines
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          python - "$ROM" <<'PY' > evidence/re/unit-flag-0x10-trace.txt
          import json
          import re
          import struct
          import sys
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs
          from capstone.arm import ARM_OP_MEM, ARM_REG_PC

          TARGETS = {
              0x020469F8: 0x02046B60,
              0x020545C0: 0x02054894,
          }

          rom = Path(sys.argv[1]).read_bytes()
          expected = json.loads(Path('profiles/civrev-us.json').read_text())['expected']
          base = int(expected['arm9_ram_address'])
          rom_off = int(expected['arm9_offset'])
          size = int(expected['arm9_size'])
          arm9 = rom[rom_off:rom_off + size]
          end = base + len(arm9)

          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = True
          insns = [i for i in md.disasm(arm9, base) if i.id != 0 and i.address % 4 == 0]
          by_addr = {i.address: n for n, i in enumerate(insns)}

          def ascii_at_ram(ptr):
              if not (base <= ptr < end):
                  return None
              p = ptr - base
              data = bytearray()
              while p < len(arm9) and len(data) < 120:
                  b = arm9[p]
                  if b == 0:
                      break
                  if b in {9, 10, 13} or 0x20 <= b <= 0x7e:
                      data.append(b)
                      p += 1
                      continue
                  return None
              if len(data) < 4:
                  return None
              return data.decode('ascii', errors='replace')

          def literal_annotation(i):
              if i.mnemonic.lower() != 'ldr':
                  return None
              for op in i.operands:
                  if op.type == ARM_OP_MEM and op.mem.base == ARM_REG_PC:
                      lit = ((i.address + 8) & ~3) + int(op.mem.disp)
                      if not (base <= lit <= end - 4):
                          return f'literal@{lit:#010x}'
                      value = struct.unpack_from('<I', arm9, lit - base)[0]
                      text = ascii_at_ram(value)
                      if text is not None:
                          return f'literal@{lit:#010x} -> {value:#010x} ASCII={text!r}'
                      return f'literal@{lit:#010x} -> {value:#010x}'
              return None

          def print_insn(i, mark=''):
              ann = literal_annotation(i)
              extra = f' ; {ann}' if ann else ''
              print(f'{i.address:#010x}: {i.mnemonic:8} {i.op_str}{mark}{extra}')

          print('=== COMPLETE 0x10 ROUTINES ===')
          for start, stop in TARGETS.items():
              print(f'\nFUNCTION {start:#010x}..{stop:#010x}')
              found = 0
              for i in insns:
                  if start <= i.address <= stop:
                      mark = ' ; FLAG 0x10' if '#0x10' in i.op_str and i.mnemonic.lower().startswith(('tst', 'and')) else ''
                      print_insn(i, mark)
                      found += 1
              print(f'instruction_count={found}')

          print('\n=== DIRECT CALLERS ===')
          for target in TARGETS:
              print(f'\nTARGET {target:#010x}')
              matches = []
              pattern = re.compile(r'#(0x[0-9a-fA-F]+|\d+)')
              for idx, i in enumerate(insns):
                  if not i.mnemonic.lower().startswith('bl'):
                      continue
                  m = pattern.search(i.op_str)
                  if not m or int(m.group(1), 0) != target:
                      continue
                  matches.append(i.address)
                  print(f'-- caller site {i.address:#010x} --')
                  for y in insns[max(0, idx - 24):min(len(insns), idx + 20)]:
                      print_insn(y, ' ; CALL' if y.address == i.address else '')
              print(f'caller_count={len(matches)}')

          print('\n=== ALL UNIT-INSTANCE +0x26 ACCESSES NEAR 0x94-DESCRIPTOR LOOKUPS ===')
          for idx, i in enumerate(insns):
              if '#0x26' not in i.op_str:
                  continue
              window = insns[max(0, idx - 20):min(len(insns), idx + 21)]
              texts = [f'{y.mnemonic} {y.op_str}' for y in window]
              if not any('#0x94' in text for text in texts):
                  continue
              print(f'\n-- +0x26 site {i.address:#010x} --')
              for y in window:
                  print_insn(y, ' ; +0x26' if y.address == i.address else '')
          PY
      - name: Commit targeted trace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-flag-0x10-trace.txt
          git commit -m "analysis: trace unit flag 0x10 relationship handling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
