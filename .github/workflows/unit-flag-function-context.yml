name: Civ Rev unit flag function context

on:
  push:
    branches:
      - analysis/civrev-unit-survey
    paths:
      - .github/workflows/unit-flag-function-context.yml

permissions:
  contents: write

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Recover containing ARM9 routines and literals
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          python - "$ROM" <<'PY' > evidence/re/unit-flag-function-context.txt
          import json
          import struct
          import sys
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs
          from capstone.arm import ARM_OP_MEM, ARM_REG_PC

          SELECTED = {0x1, 0x10, 0x80, 0x2000, 0x8000, 0x10000, 0x20000, 0x80000}

          rom = Path(sys.argv[1]).read_bytes()
          expected = json.loads(Path('profiles/civrev-us.json').read_text())['expected']
          base = int(expected['arm9_ram_address'])
          rom_off = int(expected['arm9_offset'])
          size = int(expected['arm9_size'])
          arm9 = rom[rom_off:rom_off + size]
          end = base + len(arm9)

          survey = json.loads(Path('evidence/re/unit-flag-runtime-uses.json').read_text())
          uses = []
          for item in survey['masks']:
              if item['mask'] in SELECTED:
                  for use in item['uses']:
                      uses.append((item['mask'], item['mask_hex'], use['mask_address']))

          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = False
          insns = list(md.disasm(arm9, base))
          by_addr = {i.address: n for n, i in enumerate(insns)}

          def is_prologue(i):
              text = f'{i.mnemonic} {i.op_str}'.lower()
              return (
                  (i.mnemonic.lower() in {'push', 'stmdb'} and 'lr' in i.op_str.lower())
                  or text.startswith('stmdb sp!,') and 'lr' in text
              )

          def is_return(i):
              text = f'{i.mnemonic} {i.op_str}'.lower()
              return (
                  (i.mnemonic.lower() in {'pop', 'ldmia'} and 'pc' in i.op_str.lower())
                  or text == 'bx lr'
              )

          def bounds(idx):
              start = max(0, idx - 250)
              for j in range(idx, max(-1, idx - 250), -1):
                  if is_prologue(insns[j]):
                      start = j
                      break
              stop = min(len(insns) - 1, idx + 350)
              for j in range(idx, min(len(insns), idx + 350)):
                  if is_return(insns[j]):
                      stop = j
                      break
              return start, stop

          def ascii_at_ram(ptr):
              if not (base <= ptr < end):
                  return None
              p = ptr - base
              data = bytearray()
              while p < len(arm9) and len(data) < 160:
                  b = arm9[p]
                  if b == 0:
                      break
                  if b in {9, 10, 13} or 0x20 <= b <= 0x7e:
                      data.append(b)
                      p += 1
                      continue
                  return None
              if len(data) < 4:
                  return None
              return data.decode('ascii', errors='replace')

          def literal_annotation(i):
              if i.mnemonic.lower() != 'ldr':
                  return None
              for op in i.operands:
                  if op.type == ARM_OP_MEM and op.mem.base == ARM_REG_PC:
                      lit = ((i.address + 8) & ~3) + int(op.mem.disp)
                      if not (base <= lit <= end - 4):
                          return f'literal@{lit:#010x}'
                      value = struct.unpack_from('<I', arm9, lit - base)[0]
                      text = ascii_at_ram(value)
                      if text is not None:
                          return f'literal@{lit:#010x} -> {value:#010x} ASCII={text!r}'
                      return f'literal@{lit:#010x} -> {value:#010x}'
              return None

          grouped = {}
          for mask, mask_hex, addr in uses:
              idx = by_addr.get(addr)
              if idx is None:
                  continue
              lo, hi = bounds(idx)
              key = (lo, hi)
              grouped.setdefault(key, {'masks': set(), 'sites': []})
              grouped[key]['masks'].add((mask, mask_hex))
              grouped[key]['sites'].append(addr)

          if not grouped:
              raise RuntimeError('selected flag sites were not present in the ARM9 disassembly')

          print('=== PROVENANCE-BACKED UNIT FLAG ROUTINES ===')
          print(f'routine_count={len(grouped)}')
          print()
          for (lo, hi), meta in sorted(grouped.items(), key=lambda kv: insns[kv[0][0]].address):
              routine = insns[lo:hi + 1]
              start_addr = routine[0].address
              end_addr = routine[-1].address
              masks = ', '.join(m[1] for m in sorted(meta['masks']))
              sites = ', '.join(f'{a:#010x}' for a in sorted(meta['sites']))
              print(f'FUNCTION {start_addr:#010x}..{end_addr:#010x} masks=[{masks}] sites=[{sites}]')

              literals = []
              calls = []
              for i in routine:
                  ann = literal_annotation(i)
                  if ann:
                      literals.append((i.address, i.mnemonic, i.op_str, ann))
                  if i.mnemonic.lower().startswith('bl'):
                      calls.append((i.address, i.mnemonic, i.op_str))

              if literals:
                  print('  PC-relative literals:')
                  for addr, mnem, opstr, ann in literals:
                      print(f'    {addr:#010x}: {mnem:8} {opstr:28} ; {ann}')
              if calls:
                  print('  Calls:')
                  for addr, mnem, opstr in calls:
                      print(f'    {addr:#010x}: {mnem:8} {opstr}')

              print('  Flag-site neighborhoods:')
              for site in sorted(meta['sites']):
                  idx = by_addr[site]
                  print(f'    -- site {site:#010x} --')
                  for i in insns[max(lo, idx - 28):min(hi + 1, idx + 45)]:
                      mark = ' ; FLAG SITE' if i.address == site else ''
                      ann = literal_annotation(i)
                      extra = f' ; {ann}' if ann else ''
                      print(f'    {i.address:#010x}: {i.mnemonic:8} {i.op_str}{mark}{extra}')
              print()
          PY
      - name: Commit function-context evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-flag-function-context.txt
          git commit -m "analysis: recover unit flag function contexts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
