name: Civ Rev Unit Record Survey

on:
  push:
    branches:
      - analysis/civrev-unit-survey
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Survey records after Future Technology
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import math
          import struct
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9 = (workspace / "original" / "arm9.bin").read_bytes()
          base = int(manifest["arm9_ram_address"])

          RECORD_SIZE = 0x6A
          NAME_SIZE = 32
          EFFECT_OFFSET = 42
          EFFECT_SIZE = 64

          known_names = [
              "Settlers", "Swordsman", "Warrior", "Legion", "Archer", "Phalanx",
              "Riflemen", "Tank", "Knight", "Horseman", "Barbarian", "Catapult",
              "Cannon", "Artillery", "Galley", "Galleon", "Cruiser", "Battleship",
              "Submarine", "Fighter", "Bomber", "Spy", "Caravan",
          ]

          def all_offsets(text):
              needle = text.encode("ascii") + b"\x00"
              out = []
              pos = 0
              while True:
                  pos = arm9.find(needle, pos)
                  if pos < 0:
                      return out
                  out.append(pos)
                  pos += 1

          def parse_text(slot, *, allow_empty=False):
              nul = slot.find(b"\x00")
              if nul < 0:
                  return None
              raw = slot[:nul]
              if not raw:
                  return "" if allow_empty and not any(slot) else None
              if not all(0x20 <= b <= 0x7E for b in raw):
                  return None
              if any(slot[nul+1:]):
                  return None
              return raw.decode("ascii")

          settlers_hits = all_offsets("Settlers")
          if len(settlers_hits) != 1:
              raise RuntimeError(f"expected one Settlers anchor, got {len(settlers_hits)}")
          settlers = settlers_hits[0]

          future_hits = all_offsets("Future Technology")
          if len(future_hits) != 1 or settlers - future_hits[0] != RECORD_SIZE:
              raise RuntimeError("Settlers does not immediately follow Future Technology at 106-byte stride")

          known = []
          relevant_offsets = []
          for name in known_names:
              hits = all_offsets(name)
              rows = []
              for off in hits:
                  delta = off - settlers
                  aligned = delta % RECORD_SIZE == 0
                  index = delta // RECORD_SIZE if aligned else None
                  rows.append({
                      "offset": off,
                      "address": base + off,
                      "delta_from_settlers": delta,
                      "aligned_106": aligned,
                      "record_index_from_settlers": index,
                  })
                  if aligned and 0 <= index < 256:
                      relevant_offsets.append(off)
              known.append({"name": name, "hits": rows})

          aligned_deltas = sorted(set(off - settlers for off in relevant_offsets if off >= settlers))
          gcd_delta = 0
          for delta in aligned_deltas:
              gcd_delta = math.gcd(gcd_delta, delta)

          records = []
          first_invalid = None
          for idx in range(256):
              off = settlers + idx * RECORD_SIZE
              raw = arm9[off:off+RECORD_SIZE]
              if len(raw) != RECORD_SIZE:
                  first_invalid = {"index": idx, "reason": "truncated", "offset": off, "address": base+off}
                  break
              name = parse_text(raw[:NAME_SIZE])
              effect = parse_text(raw[EFFECT_OFFSET:EFFECT_OFFSET+EFFECT_SIZE], allow_empty=True)
              if name is None or effect is None:
                  first_invalid = {
                      "index": idx,
                      "reason": "text_slot_validation_failed",
                      "offset": off,
                      "address": base+off,
                      "name_slot_hex": raw[:NAME_SIZE].hex(),
                      "effect_slot_hex": raw[EFFECT_OFFSET:EFFECT_OFFSET+EFFECT_SIZE].hex(),
                  }
                  break
              records.append({
                  "index_from_settlers": idx,
                  "offset": off,
                  "address": base+off,
                  "name": name,
                  "metadata_s16": list(struct.unpack_from("<5h", raw, 0x20)),
                  "effect": effect,
                  "raw_hex": raw.hex(),
              })

          # Also inspect one record before and several after the validated run for boundaries.
          boundary_previews = []
          for idx in range(-2, len(records)+4):
              off = settlers + idx * RECORD_SIZE
              if off < 0 or off + RECORD_SIZE > len(arm9):
                  continue
              raw = arm9[off:off+RECORD_SIZE]
              boundary_previews.append({
                  "index_from_settlers": idx,
                  "address": base+off,
                  "name_best_effort": raw[:32].split(b"\x00",1)[0].decode("ascii", errors="replace"),
                  "metadata_s16": list(struct.unpack_from("<5h", raw, 0x20)),
                  "effect_best_effort": raw[42:].split(b"\x00",1)[0].decode("ascii", errors="replace"),
              })

          payload = {
              "format_version": 1,
              "record_size": RECORD_SIZE,
              "future_technology_address": base + future_hits[0],
              "settlers_address": base + settlers,
              "known_name_hits": known,
              "aligned_known_delta_gcd": gcd_delta,
              "validated_contiguous_records": records,
              "validated_record_count": len(records),
              "first_invalid_record": first_invalid,
              "boundary_previews": boundary_previews,
          }
          Path("evidence/re/unit-record-survey.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")

          print(json.dumps({
              "settlers": hex(base+settlers),
              "validated_record_count": len(records),
              "first_invalid": first_invalid,
              "aligned_known_delta_gcd": gcd_delta,
              "records": [
                  {"index": r["index_from_settlers"], "name": r["name"], "metadata": r["metadata_s16"], "effect": r["effect"]}
                  for r in records
              ],
              "known_aligned": [
                  {"name": row["name"], "indices": [h["record_index_from_settlers"] for h in row["hits"] if h["aligned_106"] and h["record_index_from_settlers"] is not None and 0 <= h["record_index_from_settlers"] < 256]}
                  for row in known
              ],
          }, sort_keys=True))
          PY
      - name: Commit derived unit survey evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-record-survey.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: survey unit record family [generated]"
          git push origin HEAD:analysis/civrev-unit-survey
