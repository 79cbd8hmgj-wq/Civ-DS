name: Civ Rev Unit Field Usage

on:
  push:
    branches:
      - analysis/civrev-unit-survey
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Trace unit table consumers
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, CS_MODE_THUMB, Cs
          from capstone.arm import ARM_OP_MEM

          workspace=Path(sys.argv[1])
          manifest=json.loads((workspace/'manifests'/'workspace.json').read_text())
          arm9_path=workspace/'original'/'arm9.bin'
          arm9=arm9_path.read_bytes()
          arm9_base=int(manifest['arm9_ram_address'])

          def unique(needle,label):
              hits=[]; p=0
              while True:
                  p=arm9.find(needle,p)
                  if p<0: break
                  hits.append(p); p+=1
              if len(hits)!=1: raise RuntimeError(f'expected one {label}, got {len(hits)}')
              return hits[0]

          table_base=arm9_base+unique(b'Settlers\0','Settlers')
          stride=0x94
          meta_start=0x40
          meta_end=0x54

          components=[('arm9',arm9_path,arm9_base)]
          for ov in manifest['overlays']:
              oid=int(ov['overlay_id'])
              components.append((f'overlay_{oid:03d}',workspace/'original'/'decoded'/'overlays'/f'overlay_{oid:03d}.bin',int(ov['ram_address'])))

          # First collect aligned literal words equal to the descriptor-table base.
          literal_maps={}
          literal_words=[]
          for component,path,base in components:
              blob=path.read_bytes(); mapping={}
              for off in range(0,len(blob)-3,4):
                  value=int.from_bytes(blob[off:off+4],'little')
                  if value==table_base:
                      row={'component':component,'literal_address':base+off,'literal_offset':off,'value':value}
                      literal_words.append(row); mapping[base+off]=row
              literal_maps[component]=mapping

          literal_uses=[]
          all_meta_accesses=[]
          for component,path,base in components:
              blob=path.read_bytes()
              mapping=literal_maps[component]
              for mode_name,mode,align in (('arm',CS_MODE_ARM,4),('thumb',CS_MODE_THUMB,2)):
                  md=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
                  insns=[i for i in md.disasm(blob,base) if i.id!=0 and i.address%align==0]
                  for idx,insn in enumerate(insns):
                      ops=getattr(insn,'operands',())
                      # Broad scan for accesses exactly inside the 20-byte metadata block.
                      memop=next((op for op in ops if op.type==ARM_OP_MEM),None)
                      if memop is not None and meta_start <= int(memop.mem.disp) < meta_end:
                          context=insns[max(0,idx-12):min(len(insns),idx+15)]
                          text=' '.join(f'{x.mnemonic} {x.op_str}' for x in context)
                          all_meta_accesses.append({
                              'component':component,'instruction_set':mode_name,'address':int(insn.address),
                              'instruction':f'{insn.mnemonic} {insn.op_str}'.strip(),
                              'field_offset':int(memop.mem.disp),
                              'base_register':insn.reg_name(memop.mem.base),
                              'nearby_stride_0x94':('#0x94' in text or '#148' in text),
                              'nearby_table_base_literal':any(
                                  x.address in mapping or any(f'#{hex(table_base)}' in x.op_str for _ in [0])
                                  for x in context
                              ),
                              'context':[{'address':int(x.address),'mnemonic':str(x.mnemonic),'operands':str(x.op_str),'is_access':x.address==insn.address} for x in context],
                          })

                      # Identify PC-relative loads of words equal to table_base.
                      if len(ops)<2 or ops[1].type!=ARM_OP_MEM:
                          continue
                      mem=ops[1].mem
                      if insn.reg_name(mem.base)!='pc' or mem.index!=0:
                          continue
                      pc=insn.address+8 if mode_name=='arm' else (insn.address+4)&~3
                      lit=(pc+int(mem.disp))&0xffffffff
                      ptr=mapping.get(lit)
                      if ptr is None: continue
                      context=insns[max(0,idx-20):min(len(insns),idx+35)]
                      text=' '.join(f'{x.mnemonic} {x.op_str}' for x in context)
                      literal_uses.append({
                          **ptr,'instruction_set':mode_name,'instruction_address':int(insn.address),
                          'instruction':f'{insn.mnemonic} {insn.op_str}'.strip(),
                          'nearby_stride_0x94':('#0x94' in text or '#148' in text),
                          'context':[{'address':int(x.address),'mnemonic':str(x.mnemonic),'operands':str(x.op_str),'is_load':x.address==insn.address} for x in context],
                      })

          field_counts=Counter(r['field_offset'] for r in all_meta_accesses)
          stride_meta=[r for r in all_meta_accesses if r['nearby_stride_0x94']]
          stride_uses=[r for r in literal_uses if r['nearby_stride_0x94']]

          payload={
              'format_version':1,'table_base':table_base,'stride':stride,
              'literal_word_count':len(literal_words),'literal_words':literal_words,
              'literal_load_use_count':len(literal_uses),'literal_load_uses':literal_uses,
              'metadata_access_count':len(all_meta_accesses),'metadata_accesses':all_meta_accesses,
              'metadata_field_counts':[{'offset':k,'count':v} for k,v in sorted(field_counts.items())],
              'stride_near_metadata_accesses':stride_meta,
              'stride_near_table_base_uses':stride_uses,
          }
          Path('evidence/re/unit-field-usage.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'table_base':hex(table_base),'literal_words':len(literal_words),'literal_load_uses':len(literal_uses),
              'metadata_accesses':len(all_meta_accesses),'field_counts':{hex(k):v for k,v in sorted(field_counts.items())},
              'stride_near_meta_count':len(stride_meta),'stride_near_base_use_count':len(stride_uses),
              'stride_meta_candidates':[{'component':r['component'],'address':hex(r['address']),'offset':hex(r['field_offset']),'instruction':r['instruction']} for r in stride_meta[:80]],
              'stride_base_candidates':[{'component':r['component'],'address':hex(r['instruction_address']),'instruction':r['instruction']} for r in stride_uses[:80]],
          },sort_keys=True))
          PY
      - name: Commit field-usage evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-field-usage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "analysis: trace unit descriptor consumers [generated]"
          git push origin HEAD:analysis/civrev-unit-survey
