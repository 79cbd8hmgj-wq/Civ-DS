name: Final Civ Rev unit evidence refresh

on:
  push:
    branches:
      - analysis/civrev-unit-survey
    paths:
      - .github/workflows/unit-evidence-final-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Regenerate unit summary from supported ROM
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds units summarize "$ROM" \
            --profile profiles/civrev-us.json \
            --output evidence/re/units.json
      - name: Commit refreshed evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/units.json
          git diff --cached --quiet && exit 0
          git commit -m "evidence: refresh singleton unit categories"
          git push origin "HEAD:${GITHUB_REF_NAME}"
