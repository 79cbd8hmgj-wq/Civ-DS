name: Civ Rev Unit Tech Link Semantics

on:
  push:
    branches:
      - analysis/civrev-unit-survey
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Trace unit technology link consumers
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs
          from capstone.arm import ARM_OP_IMM, ARM_OP_MEM

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / 'manifests' / 'workspace.json').read_text())
          arm9 = (workspace / 'original' / 'arm9.bin').read_bytes()
          base = int(manifest['arm9_ram_address'])

          def unique(needle, label):
              hits = []
              pos = 0
              while True:
                  pos = arm9.find(needle, pos)
                  if pos < 0:
                      break
                  hits.append(pos)
                  pos += 1
              if len(hits) != 1:
                  raise RuntimeError(f'expected one {label}, got {len(hits)}')
              return hits[0]

          table_base = base + unique(b'Settlers\0', 'Settlers')
          tech_predicate = 0x020957A0
          link_offsets = {0x4A: 'unlock_technology', 0x4C: 'link_0x4c', 0x4E: 'link_0x4e'}

          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = True
          insns = [i for i in md.disasm(arm9, base) if i.id != 0 and i.address % 4 == 0]

          def literal_target(insn):
              ops = getattr(insn, 'operands', ())
              if len(ops) < 2 or ops[1].type != ARM_OP_MEM:
                  return None
              mem = ops[1].mem
              if insn.reg_name(mem.base) != 'pc' or mem.index != 0:
                  return None
              literal_addr = insn.address + 8 + int(mem.disp)
              off = literal_addr - base
              if off < 0 or off + 4 > len(arm9):
                  return None
              return int.from_bytes(arm9[off:off+4], 'little')

          base_load_indices = [idx for idx, insn in enumerate(insns) if literal_target(insn) == table_base]

          field_accesses = []
          for idx, insn in enumerate(insns):
              if insn.mnemonic not in {'ldrsh', 'ldrh'}:
                  continue
              ops = getattr(insn, 'operands', ())
              memop = next((op for op in ops if op.type == ARM_OP_MEM), None)
              if memop is None:
                  continue
              disp = int(memop.mem.disp)
              if disp not in link_offsets:
                  continue
              nearest_base_load = None
              nearest_distance = None
              for bidx in base_load_indices:
                  distance = idx - bidx
                  if -20 <= distance <= 80 and (nearest_distance is None or abs(distance) < abs(nearest_distance)):
                      nearest_base_load = bidx
                      nearest_distance = distance
              context_insns = insns[max(0, idx-24):min(len(insns), idx+30)]
              text = ' '.join(f'{x.mnemonic} {x.op_str}' for x in context_insns)
              has_stride = '#0x94' in text or '#148' in text
              calls_predicate = False
              predicate_calls = []
              for x in context_insns:
                  if x.mnemonic not in {'bl', 'blx'}:
                      continue
                  xops = getattr(x, 'operands', ())
                  if xops and xops[0].type == ARM_OP_IMM and int(xops[0].imm) == tech_predicate:
                      calls_predicate = True
                      predicate_calls.append(int(x.address))
              if nearest_base_load is None and not has_stride and not calls_predicate:
                  continue
              field_accesses.append({
                  'address': int(insn.address),
                  'instruction': f'{insn.mnemonic} {insn.op_str}'.strip(),
                  'field_offset': disp,
                  'field_label': link_offsets[disp],
                  'base_register': insn.reg_name(memop.mem.base),
                  'nearest_table_base_load': int(insns[nearest_base_load].address) if nearest_base_load is not None else None,
                  'distance_from_table_base_load_in_instructions': nearest_distance,
                  'nearby_stride_0x94': has_stride,
                  'calls_technology_predicate_nearby': calls_predicate,
                  'predicate_call_addresses': predicate_calls,
                  'context': [
                      {
                          'address': int(x.address),
                          'mnemonic': str(x.mnemonic),
                          'operands': str(x.op_str),
                          'is_access': x.address == insn.address,
                          'is_table_base_load': literal_target(x) == table_base,
                          'is_tech_predicate_call': int(x.address) in predicate_calls,
                      }
                      for x in context_insns
                  ],
              })

          predicate_calls = []
          for idx, insn in enumerate(insns):
              if insn.mnemonic not in {'bl', 'blx'}:
                  continue
              ops = getattr(insn, 'operands', ())
              if not ops or ops[0].type != ARM_OP_IMM or int(ops[0].imm) != tech_predicate:
                  continue
              prev = insns[max(0, idx-18):idx]
              link_loads = []
              for p in prev:
                  if p.mnemonic not in {'ldrsh', 'ldrh'}:
                      continue
                  pops = getattr(p, 'operands', ())
                  pmem = next((op for op in pops if op.type == ARM_OP_MEM), None)
                  if pmem is None:
                      continue
                  disp = int(pmem.mem.disp)
                  if disp in link_offsets:
                      link_loads.append({
                          'address': int(p.address),
                          'instruction': f'{p.mnemonic} {p.op_str}'.strip(),
                          'field_offset': disp,
                          'field_label': link_offsets[disp],
                      })
              if not link_loads:
                  continue
              context = insns[max(0, idx-20):min(len(insns), idx+16)]
              predicate_calls.append({
                  'call_address': int(insn.address),
                  'link_loads_before_call': link_loads,
                  'context': [
                      {'address': int(x.address), 'mnemonic': str(x.mnemonic), 'operands': str(x.op_str), 'is_call': x.address == insn.address}
                      for x in context
                  ],
              })

          # Produce a compact report that can be read directly without the giant all-access scan.
          by_offset = {}
          for off, label in link_offsets.items():
              rows = [r for r in field_accesses if r['field_offset'] == off]
              by_offset[hex(off)] = {
                  'label': label,
                  'candidate_count': len(rows),
                  'predicate_near_count': sum(r['calls_technology_predicate_nearby'] for r in rows),
                  'stride_near_count': sum(r['nearby_stride_0x94'] for r in rows),
                  'table_base_near_count': sum(r['nearest_table_base_load'] is not None for r in rows),
              }

          payload = {
              'format_version': 1,
              'table_base': table_base,
              'record_stride': 0x94,
              'technology_predicate': tech_predicate,
              'by_offset': by_offset,
              'field_access_candidates': field_accesses,
              'predicate_calls_with_link_loads': predicate_calls,
          }
          Path('evidence/re/unit-tech-link-semantics.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')

          print(json.dumps({
              'table_base': hex(table_base),
              'by_offset': by_offset,
              'predicate_call_count_with_link_load': len(predicate_calls),
              'predicate_calls': [
                  {
                      'call': hex(r['call_address']),
                      'loads': [f"{hex(x['address'])}:{hex(x['field_offset'])}" for x in r['link_loads_before_call']],
                  }
                  for r in predicate_calls
              ],
              'best_candidates': [
                  {
                      'address': hex(r['address']),
                      'offset': hex(r['field_offset']),
                      'instruction': r['instruction'],
                      'base_load': hex(r['nearest_table_base_load']) if r['nearest_table_base_load'] else None,
                      'stride': r['nearby_stride_0x94'],
                      'predicate_calls': [hex(x) for x in r['predicate_call_addresses']],
                  }
                  for r in field_accesses
                  if r['calls_technology_predicate_nearby'] or (r['nearby_stride_0x94'] and r['nearest_table_base_load'] is not None)
              ],
          }, sort_keys=True))
          PY
      - name: Commit compact semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-tech-link-semantics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "analysis: resolve unit technology-link consumers [generated]"
          git push origin HEAD:analysis/civrev-unit-survey
