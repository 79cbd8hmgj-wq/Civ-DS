name: verify
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: ruff check src tests
      - run: mypy --strict src
      - run: pytest -q -m 'not reference_rom'
      - name: Installed CLI from unrelated directory
        run: cd "$(mktemp -d)" && python -m civds --help
      - name: Build and install wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)" && python -m civds --help
      - name: Optional exact-ROM tests
        if: ${{ env.CIVDS_REFERENCE_ROM != '' }}
        run: pytest -q -m reference_rom
