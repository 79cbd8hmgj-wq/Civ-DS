name: Civ Rev Unit 0x43 Trace

on:
  push:
    branches:
      - analysis/civrev-unit-survey

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - name: Decode expiration message records
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          python - "$ROM" <<'PY'
          import json
          import sys
          from pathlib import Path

          rom = Path(sys.argv[1]).read_bytes()
          profile = json.loads(Path('profiles/civrev-us.json').read_text())['expected']
          base = int(profile['arm9_ram_address'])
          off = int(profile['arm9_offset'])
          size = int(profile['arm9_size'])
          arm9 = rom[off:off + size]

          def region(address, length):
              start = address - base
              return arm9[start:start + length]

          def ascii_runs(raw, min_len=3):
              runs=[]; start=None
              for i,b in enumerate(raw + b'\0'):
                  if 0x20 <= b < 0x7f:
                      if start is None: start=i
                  else:
                      if start is not None and i-start >= min_len:
                          runs.append((start, raw[start:i].decode('ascii')))
                      start=None
              return runs

          for address in (0x0216D6B8, 0x0216D71C):
              raw = region(address, 0x64)
              print(f'\n=== RECORD {address:#010x} size={len(raw):#x} ===')
              for row in range(0, len(raw), 16):
                  chunk = raw[row:row+16]
                  text = ''.join(chr(b) if 0x20 <= b < 0x7f else '.' for b in chunk)
                  print(f'{address+row:#010x}: {chunk.hex(" "):<47} |{text}|')
              print('ascii runs:', ascii_runs(raw))
              print('u32 words:')
              for row in range(0, len(raw)-3, 4):
                  value=int.from_bytes(raw[row:row+4], 'little')
                  note=''
                  if base <= value < base + len(arm9):
                      target=region(value, 128)
                      runs=ascii_runs(target)
                      note=f' -> ARM9 {value:#010x} ascii={runs[:4]}'
                  print(f'  +{row:#04x}: {value:#010x}{note}')

          print('\n=== NEARBY RECORDS ===')
          raw = region(0x0216D590, 0x300)
          for rel,text in ascii_runs(raw, min_len=4):
              print(f'{0x0216D590+rel:#010x}: {text!r}')
          PY
