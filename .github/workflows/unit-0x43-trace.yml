name: Civ Rev Unit 0x43 Trace

on:
  push:
    branches:
      - analysis/civrev-unit-survey

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Trace field 0x43 functions
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          python - "$ROM" <<'PY'
          import json
          import sys
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs
          from capstone.arm import ARM_OP_MEM

          rom = Path(sys.argv[1]).read_bytes()
          profile = json.loads(Path('profiles/civrev-us.json').read_text())['expected']
          arm9_base = int(profile['arm9_ram_address'])
          arm9_offset = int(profile['arm9_offset'])
          arm9_size = int(profile['arm9_size'])
          arm9 = rom[arm9_offset:arm9_offset + arm9_size]

          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = True

          windows = [
              (0x02039440, 0x02039560, {0x020394C0, 0x020394EC}),
              (0x020568E0, 0x02056AD0, {0x02056980, 0x020569C4}),
          ]
          for start, end, targets in windows:
              start_off = start - arm9_base
              end_off = end - arm9_base
              print(f'\n=== WINDOW {start:#010x}..{end:#010x} ===')
              for insn in md.disasm(arm9[start_off:end_off], start):
                  marks = []
                  if insn.address in targets:
                      marks.append('TARGET')
                  if '#0x43' in insn.op_str:
                      marks.append('FIELD43')
                  if '#0x32' in insn.op_str:
                      marks.append('RUNTIME32')
                  if insn.mnemonic in {'bl', 'blx'}:
                      marks.append('CALL')
                  suffix = f" ; {'|'.join(marks)}" if marks else ''
                  print(f'{insn.address:#010x}: {insn.mnemonic:8} {insn.op_str}{suffix}')

          print('\n=== EXPIRATION PATH LITERALS ===')
          for address in (0x020569FC, 0x02056A00, 0x02056A10, 0x02056A14):
              off = address - arm9_base
              insn = next(md.disasm(arm9[off:off + 4], address))
              mem = next((op.mem for op in insn.operands if op.type == ARM_OP_MEM), None)
              if mem is None or insn.reg_name(mem.base) != 'pc':
                  print(f'{address:#010x}: not PC-relative: {insn.mnemonic} {insn.op_str}')
                  continue
              literal_address = address + 8 + int(mem.disp)
              literal_off = literal_address - arm9_base
              value = int.from_bytes(arm9[literal_off:literal_off + 4], 'little')
              print(
                  f'{address:#010x}: {insn.mnemonic} {insn.op_str} '
                  f'literal={literal_address:#010x} value={value:#010x}'
              )
              value_off = value - arm9_base
              if not 0 <= value_off < len(arm9):
                  continue
              raw = arm9[value_off:value_off + 160]
              ascii_part = raw.split(b'\0', 1)[0]
              if ascii_part and all(0x20 <= b < 0x7f for b in ascii_part):
                  print(f'  ascii={ascii_part.decode("ascii")!r}')
              try:
                  terminator = raw.find(b'\0\0')
                  if terminator > 0:
                      terminator -= terminator % 2
                      utf16 = raw[:terminator].decode('utf-16-le')
                      if utf16 and all(ch.isprintable() for ch in utf16):
                          print(f'  utf16={utf16!r}')
              except UnicodeDecodeError:
                  pass
          PY
