name: Civ Rev unresolved unit field trace

on:
  push:
    branches:
      - analysis/civrev-unit-survey

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Trace unit metadata column 0x44-0x47
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          python - "$ROM" <<'PY' > evidence/re/unit-unresolved-trace.txt
          import json
          import sys
          from pathlib import Path
          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs
          from capstone.arm import ARM_OP_IMM, ARM_OP_MEM, ARM_OP_REG

          rom = Path(sys.argv[1]).read_bytes()
          expected = json.loads(Path('profiles/civrev-us.json').read_text())['expected']
          base = int(expected['arm9_ram_address'])
          off = int(expected['arm9_offset'])
          size = int(expected['arm9_size'])
          arm9 = rom[off:off + size]
          table_base = 0x02179F20
          column_base = table_base + 0x44
          record_size = 0x94

          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = True
          insns = [i for i in md.disasm(arm9, base) if i.id != 0 and i.address % 4 == 0]

          def literal_target(insn):
              ops = getattr(insn, 'operands', ())
              if len(ops) < 2 or ops[1].type != ARM_OP_MEM:
                  return None
              mem = ops[1].mem
              if insn.reg_name(mem.base) != 'pc' or mem.index != 0:
                  return None
              addr = insn.address + 8 + int(mem.disp)
              pos = addr - base
              if not 0 <= pos <= len(arm9) - 4:
                  return None
              return int.from_bytes(arm9[pos:pos+4], 'little')

          def reg_name(insn, op):
              return insn.reg_name(op.reg) if op.type == ARM_OP_REG else None

          refs=[]
          for idx, insn in enumerate(insns):
              target = literal_target(insn)
              if target in {column_base, column_base+1, column_base+2, column_base+3}:
                  refs.append((idx, insn, target))

          print('=== DIRECT COLUMN LITERAL REFERENCES ===')
          print(f'count={len(refs)}')
          for idx, insn, target in refs:
              print(f'{insn.address:#010x}: {insn.mnemonic} {insn.op_str} -> {target:#010x} offset={target-table_base:#04x}')

          print('\n=== COLUMN-BASE WINDOWS ===')
          for idx, insn, target in refs:
              ops=getattr(insn,'operands',())
              dst = reg_name(insn, ops[0]) if ops else None
              print(f'\nREF {insn.address:#010x} target={target:#010x} record_offset={target-table_base:#04x} dst={dst}')
              for x in insns[max(0,idx-18):min(len(insns),idx+55)]:
                  marks=[]
                  if x.address == insn.address: marks.append('COLUMN_REF')
                  if any(op.type == ARM_OP_IMM and int(op.imm) == record_size for op in getattr(x,'operands',())):
                      marks.append('STRIDE_0x94')
                  for op in getattr(x,'operands',()):
                      if op.type == ARM_OP_MEM:
                          b=x.reg_name(op.mem.base)
                          d=int(op.mem.disp)
                          if dst and b == dst and d in (0,1,2,3):
                              marks.append(f'{dst}+{d}')
                          if d in (0,1,2,3) and x.mnemonic.startswith(('ldr','str')):
                              marks.append(f'MEM+{d}')
                  if x.mnemonic in {'ldrb','ldrsb','ldrh','ldrsh','ldr','strb','strh','str','cmp','tst','and','ands','orr','orrs','eor','lsl','lsr','asr','ubfx','sbfx','mla','mul'}:
                      marks.append('DATAFLOW')
                  if x.mnemonic in {'bl','blx'}: marks.append('CALL')
                  suffix=f" ; {'|'.join(dict.fromkeys(marks))}" if marks else ''
                  print(f'  {x.address:#010x}: {x.mnemonic:8} {x.op_str}{suffix}')
          PY
      - name: Commit trace for analysis
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- evidence/re/unit-unresolved-trace.txt)" ]; then
            echo "Trace is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-unresolved-trace.txt
          git commit -m "analysis: capture focused unit metadata trace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
