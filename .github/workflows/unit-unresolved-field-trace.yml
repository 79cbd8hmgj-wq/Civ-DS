name: Civ Rev unresolved unit field trace

on:
  push:
    branches:
      - analysis/civrev-unit-survey

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Resolve effective unit metadata offsets
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          python - "$ROM" <<'PY' > evidence/re/unit-unresolved-trace.txt
          import json
          import sys
          from collections import defaultdict
          from pathlib import Path
          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs
          from capstone.arm import ARM_OP_MEM, ARM_OP_REG

          rom = Path(sys.argv[1]).read_bytes()
          expected = json.loads(Path('profiles/civrev-us.json').read_text())['expected']
          base = int(expected['arm9_ram_address'])
          off = int(expected['arm9_offset'])
          size = int(expected['arm9_size'])
          arm9 = rom[off:off + size]
          table_base = 0x02179F20
          record_size = 0x94

          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = True
          insns = [i for i in md.disasm(arm9, base) if i.id != 0 and i.address % 4 == 0]

          def literal_target(insn):
              ops = getattr(insn, 'operands', ())
              if len(ops) < 2 or ops[1].type != ARM_OP_MEM:
                  return None
              mem = ops[1].mem
              if insn.reg_name(mem.base) != 'pc' or mem.index != 0:
                  return None
              addr = insn.address + 8 + int(mem.disp)
              pos = addr - base
              if not 0 <= pos <= len(arm9) - 4:
                  return None
              return int.from_bytes(arm9[pos:pos+4], 'little')

          def dst_reg(insn):
              ops = getattr(insn, 'operands', ())
              if not ops or ops[0].type != ARM_OP_REG:
                  return None
              return insn.reg_name(ops[0].reg)

          def written_regs(insn):
              try:
                  _reads, writes = insn.regs_access()
                  return {insn.reg_name(r) for r in writes}
              except Exception:
                  return set()

          refs=[]
          for idx, insn in enumerate(insns):
              target = literal_target(insn)
              if target is None:
                  continue
              delta = target - table_base
              if 0x3c <= delta <= 0x53:
                  d = dst_reg(insn)
                  if d:
                      refs.append((idx, insn, target, delta, d))

          accesses=[]
          for idx, insn, target, delta, dreg in refs:
              for j in range(idx+1, min(len(insns), idx+25)):
                  x=insns[j]
                  hit=False
                  for op in getattr(x,'operands',()):
                      if op.type != ARM_OP_MEM:
                          continue
                      if x.reg_name(op.mem.base) != dreg:
                          continue
                      disp=int(op.mem.disp)
                      effective=delta+disp
                      accesses.append((effective, idx, j, insn, x, target, delta, dreg, disp))
                      hit=True
                  if dreg in written_regs(x):
                      # A load like ldrsb r2,[r2,r1] consumes the pointer and overwrites it.
                      break

          by_eff=defaultdict(list)
          for row in accesses:
              by_eff[row[0]].append(row)

          print('=== EFFECTIVE RECORD OFFSET ACCESS MAP ===')
          for eff in sorted(by_eff):
              if not 0x40 <= eff <= 0x53:
                  continue
              rows=by_eff[eff]
              print(f'offset={eff:#04x} count={len(rows)}')
              for _, idx, j, ref, x, target, delta, dreg, disp in rows:
                  print(
                      f'  ref={ref.address:#010x} literal={target:#010x} base_offset={delta:#04x} '
                      f'dst={dreg} -> access={x.address:#010x} {x.mnemonic} {x.op_str} disp={disp:+#x}'
                  )

          print('\n=== UNRESOLVED FIELD DETAIL ===')
          for eff in (0x45,0x46,0x47):
              rows=by_eff.get(eff,[])
              print(f'\nFIELD {eff:#04x} direct_pointer_accesses={len(rows)}')
              seen=set()
              for _, idx, j, ref, x, target, delta, dreg, disp in rows:
                  key=(ref.address,x.address)
                  if key in seen:
                      continue
                  seen.add(key)
                  print(
                      f'\nREF {ref.address:#010x} literal_offset={delta:#04x} {ref.mnemonic} {ref.op_str}\n'
                      f'ACCESS {x.address:#010x}: {x.mnemonic} {x.op_str}'
                  )
                  for y in insns[max(0,j-14):min(len(insns),j+22)]:
                      mark=' ; ACCESS' if y.address == x.address else ''
                      print(f'  {y.address:#010x}: {y.mnemonic:8} {y.op_str}{mark}')
          PY
      - name: Commit trace for analysis
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- evidence/re/unit-unresolved-trace.txt)" ]; then
            echo "Trace is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-unresolved-trace.txt
          git commit -m "analysis: capture effective unit metadata offsets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
