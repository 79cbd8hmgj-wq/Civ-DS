name: Civ Rev unit flag bit survey

on:
  push:
    branches:
      - analysis/civrev-unit-survey
    paths:
      - .github/workflows/unit-flag-bit-survey.yml

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Survey provenance-backed formation and flag accesses
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR"
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          python - "$ROM" <<'PY' > evidence/re/unit-flag-bit-survey.json
          import json
          import re
          import sys
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs
          from capstone.arm import ARM_OP_MEM
          from civds.units import parse_unit_records

          rom = Path(sys.argv[1]).read_bytes()
          expected = json.loads(Path('profiles/civrev-us.json').read_text())['expected']
          base = int(expected['arm9_ram_address'])
          off = int(expected['arm9_offset'])
          size = int(expected['arm9_size'])
          arm9 = rom[off:off + size]
          units = parse_unit_records(arm9)

          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = True
          insns = [i for i in md.disasm(arm9, base) if i.id != 0 and i.address % 4 == 0]

          def mem_accesses(insn):
              for op in getattr(insn, 'operands', ()):
                  if op.type == ARM_OP_MEM:
                      yield insn.reg_name(op.mem.base), int(op.mem.disp)

          def access_width(mnemonic: str) -> int:
              m = mnemonic.lower()
              if m.startswith(('ldrb', 'ldrsb', 'strb')):
                  return 1
              if m.startswith(('ldrh', 'ldrsh', 'strh')):
                  return 2
              if m.startswith(('ldr', 'str')):
                  return 4
              return 0

          def nearby_stride_producer(idx: int, base_reg: str):
              start = max(0, idx - 24)
              for j in range(idx - 1, start - 1, -1):
                  y = insns[j]
                  if y.mnemonic.lower() == 'mla':
                      parts = [p.strip() for p in y.op_str.split(',')]
                      if len(parts) == 4 and parts[0] == base_reg:
                          stride_regs = {parts[2], parts[1]}
                          for k in range(j - 1, max(start - 1, j - 10), -1):
                              z = insns[k]
                              if z.mnemonic.lower().startswith('mov'):
                                  zp = [p.strip() for p in z.op_str.split(',')]
                                  if len(zp) == 2 and zp[0] in stride_regs and zp[1] == '#0x94':
                                      return {
                                          'mla_address': y.address,
                                          'mla': f'{y.mnemonic} {y.op_str}',
                                          'stride_load_address': z.address,
                                          'stride_load': f'{z.mnemonic} {z.op_str}',
                                      }
              return None

          formation = []
          flag_accesses = []
          for idx, insn in enumerate(insns):
              w = access_width(insn.mnemonic)
              if not w:
                  continue
              for breg, disp in mem_accesses(insn):
                  if disp not in {0x48, 0x49, 0x50}:
                      continue
                  provenance = nearby_stride_producer(idx, breg)
                  if provenance is None:
                      continue
                  row = {
                      'address': insn.address,
                      'instruction': f'{insn.mnemonic} {insn.op_str}',
                      'base_register': breg,
                      'offset': disp,
                      'width': w,
                      'provenance': provenance,
                      'context': [
                          {
                              'address': y.address,
                              'instruction': f'{y.mnemonic} {y.op_str}',
                          }
                          for y in insns[max(0, idx - 12):min(len(insns), idx + 17)]
                      ],
                  }
                  if disp in {0x48, 0x49}:
                      formation.append(row)
                  else:
                      dest = insn.op_str.split(',', 1)[0].strip()
                      masks = []
                      for y in insns[idx + 1:min(len(insns), idx + 8)]:
                          text = f'{y.mnemonic} {y.op_str}'
                          if dest not in y.op_str:
                              continue
                          if y.mnemonic.lower().startswith(('tst', 'and', 'bic')):
                              match = re.search(r'#(0x[0-9a-fA-F]+|\d+)', y.op_str)
                              if match:
                                  masks.append({
                                      'address': y.address,
                                      'instruction': text,
                                      'mask': int(match.group(1), 0),
                                  })
                      row['nearby_masks'] = masks
                      flag_accesses.append(row)

          bit_membership = {}
          for bit in range(32):
              mask = 1 << bit
              names = [unit.name or f'<unnamed:{unit.index}>' for unit in units if unit.flags & mask]
              if names:
                  bit_membership[f'0x{mask:08X}'] = names

          output = {
              'format_version': 1,
              'unit_record_count': len(units),
              'unknown_0x49_values': sorted({unit.unknown_0x49 for unit in units}),
              'formation_accesses': formation,
              'formation_access_count_by_offset': {
                  '0x48': sum(row['offset'] == 0x48 for row in formation),
                  '0x49': sum(row['offset'] == 0x49 for row in formation),
              },
              'flag_accesses': flag_accesses,
              'observed_flag_masks': sorted({m['mask'] for row in flag_accesses for m in row['nearby_masks']}),
              'bit_membership': bit_membership,
          }
          print(json.dumps(output, indent=2, sort_keys=True))
          PY
      - name: Commit survey evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-flag-bit-survey.json
          git commit -m "analysis: survey unit flag bits and formation width"
          git push origin "HEAD:${GITHUB_REF_NAME}"
