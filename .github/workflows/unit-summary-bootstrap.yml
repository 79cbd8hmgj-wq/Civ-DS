name: Civ Rev Unit Summary Bootstrap

on:
  push:
    branches:
      - analysis/civrev-unit-survey

permissions:
  contents: write

jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Generate unit summary
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds units summarize "$ROM" --output evidence/re/units.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('evidence/re/units.json').read_text())
          assert payload['record_count'] == 38
          assert payload['record_size'] == 0x94
          assert len(payload['units']) == 38
          assert payload['units'][0]['name'] == 'Settlers'
          assert payload['units'][6]['name'] == 'Warrior'
          print('validated 38 recovered unit descriptors')
          PY
      - name: Commit unit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/units.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: add canonical unit summary [generated]"
          git push origin HEAD:analysis/civrev-unit-survey
