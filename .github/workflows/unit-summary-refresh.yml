name: Civ Rev Unit Summary Refresh

on:
  push:
    branches:
      - analysis/civrev-unit-survey

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e .
      - name: Refresh unit evidence
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds units summarize "$ROM" --output evidence/re/units.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('evidence/re/units.json').read_text())
          warrior = payload['units'][6]
          assert payload['record_count'] == 38
          assert warrior['name'] == 'Warrior'
          assert warrior['formation_mask'] == 7
          assert warrior['formation_size'] == 3
          assert warrior['unknown_0x49'] == 0
          assert 'formation_count' not in warrior
          print('validated corrected unit formation layout')
          PY
      - name: Commit refreshed evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/units.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: correct canonical unit formation evidence [generated]"
          git push origin HEAD:analysis/civrev-unit-survey
