name: Civ Rev Tech Field Access Scan

on:
  push:
    branches:
      - analysis/civrev-tech-metadata-usage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-tech-metadata-usage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Scan halfword field consumers
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, CS_MODE_THUMB, Cs
          from capstone.arm import ARM_OP_MEM

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9_base = int(manifest["arm9_ram_address"])
          components = [("arm9", workspace / "original" / "arm9.bin", arm9_base)]
          for overlay in manifest["overlays"]:
              oid = int(overlay["overlay_id"])
              components.append((
                  f"overlay_{oid:03d}",
                  workspace / "original" / "decoded" / "overlays" / f"overlay_{oid:03d}.bin",
                  int(overlay["ram_address"]),
              ))

          field_offsets = {0x20, 0x22, 0x24, 0x26, 0x28}
          accesses = []

          for component, path, base in components:
              blob = path.read_bytes()
              for mode_name, mode, alignment in (("arm", CS_MODE_ARM, 4), ("thumb", CS_MODE_THUMB, 2)):
                  md = Cs(CS_ARCH_ARM, mode | CS_MODE_LITTLE_ENDIAN)
                  md.detail = True
                  md.skipdata = True
                  insns = [i for i in md.disasm(blob, base) if i.id != 0 and i.address % alignment == 0]
                  by_addr = {i.address: idx for idx, i in enumerate(insns)}
                  for idx, insn in enumerate(insns):
                      if insn.mnemonic not in {"ldrsh", "ldrh", "strh"}:
                          continue
                      ops = getattr(insn, "operands", ())
                      memop = next((op for op in ops if op.type == ARM_OP_MEM), None)
                      if memop is None:
                          continue
                      disp = int(memop.mem.disp)
                      if disp not in field_offsets:
                          continue
                      start = max(0, idx - 14)
                      end = min(len(insns), idx + 19)
                      context = []
                      for item in insns[start:end]:
                          context.append({
                              "address": int(item.address),
                              "mnemonic": str(item.mnemonic),
                              "operands": str(item.op_str),
                              "is_access": item.address == insn.address,
                          })
                      text = " ".join(f"{r['mnemonic']} {r['operands']}" for r in context)
                      accesses.append({
                          "component": component,
                          "instruction_set": mode_name,
                          "address": int(insn.address),
                          "mnemonic": str(insn.mnemonic),
                          "operands": str(insn.op_str),
                          "field_offset": disp,
                          "base_register": insn.reg_name(memop.mem.base),
                          "index_register": insn.reg_name(memop.mem.index) if memop.mem.index else None,
                          "nearby_has_stride_106": "#0x6a" in text or "#106" in text,
                          "nearby_has_minus_one": "#-1" in text or "mvn" in text,
                          "context": context,
                      })

          counts = Counter((r["field_offset"], r["component"], r["instruction_set"]) for r in accesses)
          payload = {
              "format_version": 1,
              "field_offsets": sorted(field_offsets),
              "access_count": len(accesses),
              "counts": [
                  {
                      "field_offset": key[0],
                      "component": key[1],
                      "instruction_set": key[2],
                      "count": value,
                  }
                  for key, value in sorted(counts.items())
              ],
              "stride_106_candidates": [r for r in accesses if r["nearby_has_stride_106"]],
              "all_accesses": accesses,
          }
          Path("evidence/re/tech-field-access-scan.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "access_count": len(accesses),
              "by_offset": {
                  hex(off): sum(1 for r in accesses if r["field_offset"] == off)
                  for off in sorted(field_offsets)
              },
              "stride_106_candidates": len(payload["stride_106_candidates"]),
              "stride_candidates": [
                  {
                      "component": r["component"],
                      "address": hex(r["address"]),
                      "offset": hex(r["field_offset"]),
                      "instruction": f"{r['mnemonic']} {r['operands']}"
                  }
                  for r in payload["stride_106_candidates"]
              ],
          }, sort_keys=True))
          PY
      - name: Commit field-access evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/tech-field-access-scan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: scan technology field consumers [generated]"
          git push origin HEAD:analysis/civrev-tech-metadata-usage
