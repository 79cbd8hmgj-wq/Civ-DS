name: Civ Rev Tech Literal Resolution

on:
  push:
    branches:
      - analysis/civrev-tech-metadata-usage

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-tech-metadata-usage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Resolve literal pools and predicate function
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path
          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, Cs

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          base = int(manifest["arm9_ram_address"])
          blob = (workspace / "original" / "arm9.bin").read_bytes()
          end = base + len(blob)

          def u32(addr):
              off = addr - base
              if off < 0 or off + 4 > len(blob):
                  raise RuntimeError(f"address outside ARM9: {addr:#x}")
              return int.from_bytes(blob[off:off+4], "little")

          def h16(addr):
              off = addr - base
              if off < 0 or off + 2 > len(blob):
                  return None
              return int.from_bytes(blob[off:off+2], "little", signed=True)

          literal_addrs = [
              0x0203FDE4,
              0x0203EDE0,
              0x020B42FC,
              0x020B4300,
              0x020B4304,
              0x020B4308,
          ]
          literals = []
          for addr in literal_addrs:
              value = u32(addr)
              entry = {
                  "literal_address": addr,
                  "value": value,
                  "value_in_arm9": base <= value < end,
                  "arm9_offset": value - base if base <= value < end else None,
              }
              if base <= value < end:
                  off = value - base
                  raw = blob[off:off+96]
                  entry["target_preview_hex"] = raw.hex()
                  # Best-effort ASCII preview from the target itself.
                  text = raw.split(b"\x00", 1)[0]
                  entry["target_ascii"] = text.decode("ascii", errors="replace") if text else ""
                  entry["target_s16_first_16"] = [h16(value + i*2) for i in range(16)]
              literals.append(entry)

          # Dump the first entries of the table referenced by the shared +20/+22/+24 lookup.
          shared = u32(0x0203EDE0)
          shared_words = []
          if base <= shared < end:
              for i in range(64):
                  a = shared + i*4
                  v = u32(a)
                  shared_words.append({
                      "index": i,
                      "address": a,
                      "value": v,
                      "value_in_arm9": base <= v < end,
                      "value_arm9_offset": v-base if base <= v < end else None,
                  })

          # Exact disassembly around the r0=ID,r1=context predicate at 0x020957A0.
          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          md.skipdata = True
          fn_start = 0x02095740
          fn_end = 0x02095980
          fn_off = fn_start - base
          predicate = [
              {"address": int(i.address), "mnemonic": str(i.mnemonic), "operands": str(i.op_str)}
              for i in md.disasm(blob[fn_off:fn_end-base], fn_start)
          ]

          # Also dump the surrounding literal-pool words used by the two caller sites.
          pool_words = []
          for start_addr, stop_addr in ((0x0203EDD0, 0x0203EE10), (0x0203FDD0, 0x0203FE00), (0x020B42F8, 0x020B4310)):
              for addr in range(start_addr, stop_addr, 4):
                  pool_words.append({"address": addr, "value": u32(addr)})

          payload = {
              "format_version": 1,
              "arm9_base": base,
              "arm9_end": end,
              "literals": literals,
              "shared_lookup_table_words": shared_words,
              "predicate_020957a0": predicate,
              "literal_pool_words": pool_words,
          }
          Path("evidence/re/tech-literal-resolution.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")

          print("LITERALS")
          for row in literals:
              print(f"{row['literal_address']:#010x} -> {row['value']:#010x} in_arm9={row['value_in_arm9']} ascii={row.get('target_ascii','')!r}")
          print("SHARED LOOKUP FIRST 24")
          for row in shared_words[:24]:
              print(f"[{row['index']:02d}] {row['value']:#010x} in_arm9={row['value_in_arm9']}")
          print("PREDICATE 0x020957A0 WINDOW")
          for i in predicate:
              print(f"{i['address']:#010x}: {i['mnemonic']:<8} {i['operands']}")
          PY
      - name: Commit literal-resolution evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/tech-literal-resolution.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: resolve technology literals and predicate [generated]"
          git push origin HEAD:analysis/civrev-tech-metadata-usage
