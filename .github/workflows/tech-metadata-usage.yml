name: Civ Rev Tech Metadata Usage

on:
  push:
    branches:
      - analysis/civrev-tech-metadata-usage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-tech-metadata-usage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Trace technology metadata field consumers
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import struct
          import sys
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, CS_MODE_THUMB, Cs
          from capstone.arm import ARM_OP_MEM

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9_path = workspace / "original" / "arm9.bin"
          arm9 = arm9_path.read_bytes()
          arm9_base = int(manifest["arm9_ram_address"])

          RECORD_SIZE = 106
          NAME_SIZE = 32
          METADATA_OFFSET = 32
          FIELD_OFFSETS = (0x20, 0x22, 0x24, 0x26, 0x28)
          EFFECT_OFFSET = 42

          def unique_offset(blob: bytes, needle: bytes, label: str) -> int:
              hits = []
              cursor = 0
              while True:
                  hit = blob.find(needle, cursor)
                  if hit < 0:
                      break
                  hits.append(hit)
                  cursor = hit + 1
              if len(hits) != 1:
                  raise RuntimeError(f"expected exactly one {label}, got {len(hits)}")
              return hits[0]

          alphabet_offset = unique_offset(arm9, b"Alphabet\x00", "Alphabet")
          settlers_offset = unique_offset(arm9, b"Settlers\x00", "Settlers")
          technology_count = (settlers_offset - alphabet_offset) // RECORD_SIZE
          if technology_count != 47:
              raise RuntimeError(f"unexpected technology count: {technology_count}")

          records = []
          for ordinal in range(technology_count):
              offset = alphabet_offset + ordinal * RECORD_SIZE
              raw = arm9[offset:offset + RECORD_SIZE]
              name = raw[:NAME_SIZE].split(b"\x00", 1)[0].decode("ascii")
              metadata = list(struct.unpack_from("<5h", raw, METADATA_OFFSET))
              effect = raw[EFFECT_OFFSET:].split(b"\x00", 1)[0].decode("ascii")
              records.append({
                  "ordinal": ordinal,
                  "address": arm9_base + offset,
                  "offset": offset,
                  "name": name,
                  "metadata_s16": metadata,
                  "effect": effect,
              })

          components = [("arm9", arm9_path, arm9_base)]
          for overlay in manifest["overlays"]:
              overlay_id = int(overlay["overlay_id"])
              components.append((
                  f"overlay_{overlay_id:03d}",
                  workspace / "original" / "decoded" / "overlays" / f"overlay_{overlay_id:03d}.bin",
                  int(overlay["ram_address"]),
              ))

          record_by_address = {row["address"]: row for row in records}
          table_start = records[0]["address"]
          table_end = records[-1]["address"] + RECORD_SIZE

          pointer_literals = []
          pointer_map_by_component = {}
          for component, path, base in components:
              blob = path.read_bytes()
              pointer_map = {}
              for off in range(0, len(blob) - 3, 4):
                  value = int.from_bytes(blob[off:off + 4], "little")
                  if table_start <= value < table_end:
                      rel = value - table_start
                      ordinal, intra = divmod(rel, RECORD_SIZE)
                      if 0 <= ordinal < technology_count:
                          entry = {
                              "component": component,
                              "literal_address": base + off,
                              "literal_offset": off,
                              "target_address": value,
                              "target_ordinal": ordinal,
                              "target_name": records[ordinal]["name"],
                              "target_intra_record_offset": intra,
                          }
                          pointer_literals.append(entry)
                          pointer_map[base + off] = entry
              pointer_map_by_component[component] = pointer_map

          uses = []
          for component, path, base in components:
              blob = path.read_bytes()
              pointer_map = pointer_map_by_component[component]
              if not pointer_map:
                  continue
              for mode_name, mode, alignment in (("arm", CS_MODE_ARM, 4), ("thumb", CS_MODE_THUMB, 2)):
                  engine = Cs(CS_ARCH_ARM, mode | CS_MODE_LITTLE_ENDIAN)
                  engine.detail = True
                  engine.skipdata = True
                  for insn in engine.disasm(blob, base):
                      if insn.id == 0 or insn.address % alignment:
                          continue
                      operands = getattr(insn, "operands", ())
                      if len(operands) < 2 or operands[1].type != ARM_OP_MEM:
                          continue
                      mem = operands[1].mem
                      if insn.reg_name(mem.base) != "pc" or mem.index != 0:
                          continue
                      pc = insn.address + 8 if mode_name == "arm" else (insn.address + 4) & ~3
                      literal_addr = (pc + int(mem.disp)) & 0xFFFFFFFF
                      ptr = pointer_map.get(literal_addr)
                      if ptr is None:
                          continue

                      start_off = insn.address - base
                      before_start = max(0, start_off - 64)
                      before_addr = base + before_start
                      context_engine = Cs(CS_ARCH_ARM, mode | CS_MODE_LITTLE_ENDIAN)
                      context_engine.skipdata = True
                      context = []
                      for item in context_engine.disasm(blob[before_start:start_off + 160], before_addr):
                          if item.address < insn.address - 48 or item.address > insn.address + 128:
                              continue
                          context.append({
                              "address": int(item.address),
                              "mnemonic": str(item.mnemonic),
                              "operands": str(item.op_str),
                              "is_literal_load": int(item.address) == int(insn.address),
                          })

                      # Simple, conservative register-use scan: once the pointer is loaded into a register,
                      # record nearby immediate memory accesses through that same register until it is overwritten.
                      dest_reg = None
                      if operands and getattr(operands[0], "reg", 0):
                          dest_reg = insn.reg_name(operands[0].reg)
                      candidate_accesses = []
                      if dest_reg:
                          seen_load = False
                          for item in context:
                              if item["address"] == insn.address:
                                  seen_load = True
                                  continue
                              if not seen_load:
                                  continue
                              text = item["operands"]
                              if f"[{dest_reg}" in text:
                                  candidate_accesses.append(item)

                      uses.append({
                          **ptr,
                          "instruction_set": mode_name,
                          "instruction_address": int(insn.address),
                          "instruction": f"{insn.mnemonic} {insn.op_str}".strip(),
                          "loaded_register": dest_reg,
                          "nearby_accesses_via_loaded_register": candidate_accesses,
                          "context": context,
                      })

          # Gather metadata patterns and resolve values as technology ordinals where possible.
          metadata_summary = []
          for column, field_offset in enumerate(FIELD_OFFSETS):
              rows = []
              for rec in records:
                  value = rec["metadata_s16"][column]
                  resolved = records[value]["name"] if 0 <= value < technology_count else None
                  rows.append({
                      "ordinal": rec["ordinal"],
                      "name": rec["name"],
                      "value": value,
                      "resolved_technology": resolved,
                  })
              metadata_summary.append({
                  "column": column,
                  "field_offset": field_offset,
                  "non_minus_one_count": sum(1 for row in rows if row["value"] != -1),
                  "rows": rows,
              })

          payload = {
              "format_version": 1,
              "technology_count": technology_count,
              "table_start": table_start,
              "table_end": table_end,
              "field_offsets": list(FIELD_OFFSETS),
              "records": records,
              "metadata_columns": metadata_summary,
              "pointer_literals": sorted(pointer_literals, key=lambda row: (row["component"], row["literal_address"])),
              "literal_load_uses": sorted(uses, key=lambda row: (row["component"], row["instruction_address"], row["instruction_set"])),
          }
          Path("evidence/re/tech-metadata-usage.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")

          print(json.dumps({
              "technology_count": technology_count,
              "pointer_literals": len(pointer_literals),
              "literal_load_uses": len(uses),
              "uses_with_register_accesses": sum(bool(row["nearby_accesses_via_loaded_register"]) for row in uses),
              "field_population": [
                  {
                      "offset": hex(FIELD_OFFSETS[i]),
                      "non_minus_one": sum(1 for r in records if r["metadata_s16"][i] != -1),
                  }
                  for i in range(5)
              ],
          }, sort_keys=True))
          PY
      - name: Commit derived metadata-usage evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/tech-metadata-usage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: trace technology metadata usage [generated]"
          git push origin HEAD:analysis/civrev-tech-metadata-usage
