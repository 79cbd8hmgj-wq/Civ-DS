name: Civ Rev Tech Semantics Resolution

on:
  push:
    branches:
      - analysis/civrev-tech-metadata-usage

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-tech-metadata-usage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Resolve dependency topology and predicate backing state
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import struct
          import sys
          from collections import Counter
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, CS_MODE_THUMB, Cs
          from capstone.arm import ARM_OP_IMM, ARM_OP_MEM

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9_path = workspace / "original" / "arm9.bin"
          arm9 = arm9_path.read_bytes()
          arm9_base = int(manifest["arm9_ram_address"])
          arm9_end = arm9_base + len(arm9)

          def find_unique(blob, needle, label):
              hits = []
              p = 0
              while True:
                  p = blob.find(needle, p)
                  if p < 0:
                      break
                  hits.append(p)
                  p += 1
              if len(hits) != 1:
                  raise RuntimeError(f"expected one {label}, got {len(hits)}")
              return hits[0]

          def u32(addr):
              off = addr - arm9_base
              if not (0 <= off <= len(arm9) - 4):
                  raise RuntimeError(f"ARM9 address out of range: {addr:#x}")
              return int.from_bytes(arm9[off:off+4], "little")

          NEVER = find_unique(arm9, b"never\x00", "never")
          ALPHABET = find_unique(arm9, b"Alphabet\x00", "Alphabet")
          FUTURE = find_unique(arm9, b"Future Technology\x00", "Future Technology")
          RECORD_SIZE = 0x6A
          runtime_base_off = NEVER
          runtime_base = arm9_base + runtime_base_off
          if ALPHABET - NEVER != RECORD_SIZE:
              raise RuntimeError("Alphabet is not runtime ID 1 after never")
          if FUTURE - NEVER != 47 * RECORD_SIZE:
              raise RuntimeError("Future Technology is not runtime ID 47")

          records = []
          for tech_id in range(48):
              off = NEVER + tech_id * RECORD_SIZE
              raw = arm9[off:off+RECORD_SIZE]
              name = raw[:32].split(b"\x00", 1)[0].decode("ascii")
              refs = list(struct.unpack_from("<3h", raw, 0x20))
              mask = struct.unpack_from("<h", raw, 0x26)[0]
              reserved = struct.unpack_from("<h", raw, 0x28)[0]
              records.append({
                  "runtime_id": tech_id,
                  "name": name,
                  "address": arm9_base + off,
                  "dependency_slots": refs,
                  "category_mask": mask,
                  "field_0x28": reserved,
              })

          topology = []
          violations = []
          ref_counts = Counter()
          for rec in records[1:]:
              refs = []
              for slot, value in enumerate(rec["dependency_slots"]):
                  kind = "reference"
                  target = None
                  if value == -1:
                      kind = "minus_one_sentinel"
                  elif value == 99:
                      kind = "99_sentinel"
                  elif 0 <= value < len(records):
                      target = records[value]["name"]
                      ref_counts[value] += 1
                      if value == 0:
                          kind = "never_sentinel"
                      elif value < rec["runtime_id"]:
                          kind = "earlier_technology"
                      else:
                          kind = "non_predecessor_reference"
                          violations.append({
                              "source_id": rec["runtime_id"],
                              "source_name": rec["name"],
                              "slot": slot,
                              "value": value,
                              "target_name": target,
                          })
                  else:
                      kind = "out_of_range"
                      violations.append({
                          "source_id": rec["runtime_id"],
                          "source_name": rec["name"],
                          "slot": slot,
                          "value": value,
                          "target_name": None,
                      })
                  refs.append({"slot": slot, "value": value, "kind": kind, "target_name": target})
              topology.append({
                  "runtime_id": rec["runtime_id"],
                  "name": rec["name"],
                  "references": refs,
                  "category_mask": rec["category_mask"],
              })

          predicate_bitset_ptr = u32(0x020957F8)

          components = [("arm9", arm9_path, arm9_base)]
          for ov in manifest["overlays"]:
              oid = int(ov["overlay_id"])
              components.append((
                  f"overlay_{oid:03d}",
                  workspace / "original" / "decoded" / "overlays" / f"overlay_{oid:03d}.bin",
                  int(ov["ram_address"]),
              ))

          interesting_globals = {
              "dependency_state_array": 0x021C8AD8,
              "predicate_bitset_array": predicate_bitset_ptr,
              "runtime_tech_table": runtime_base,
          }

          literal_words = []
          literal_load_uses = []
          for component, path, base in components:
              blob = path.read_bytes()
              word_map = {}
              for off in range(0, len(blob)-3, 4):
                  value = int.from_bytes(blob[off:off+4], "little")
                  labels = [label for label, target in interesting_globals.items() if value == target]
                  if not labels:
                      continue
                  row = {"component": component, "address": base+off, "offset": off, "value": value, "labels": labels}
                  literal_words.append(row)
                  word_map[base+off] = row

              if not word_map:
                  continue
              for mode_name, mode, align in (("arm", CS_MODE_ARM, 4), ("thumb", CS_MODE_THUMB, 2)):
                  md = Cs(CS_ARCH_ARM, mode | CS_MODE_LITTLE_ENDIAN)
                  md.detail = True
                  md.skipdata = True
                  insns = [i for i in md.disasm(blob, base) if i.id != 0 and i.address % align == 0]
                  for idx, insn in enumerate(insns):
                      ops = getattr(insn, "operands", ())
                      if len(ops) < 2 or ops[1].type != ARM_OP_MEM:
                          continue
                      mem = ops[1].mem
                      if insn.reg_name(mem.base) != "pc" or mem.index != 0:
                          continue
                      pc = insn.address + 8 if mode_name == "arm" else (insn.address + 4) & ~3
                      literal_addr = (pc + int(mem.disp)) & 0xFFFFFFFF
                      lit = word_map.get(literal_addr)
                      if lit is None:
                          continue
                      context = []
                      for item in insns[max(0, idx-10):min(len(insns), idx+14)]:
                          context.append({
                              "address": int(item.address),
                              "mnemonic": str(item.mnemonic),
                              "operands": str(item.op_str),
                              "is_load": item.address == insn.address,
                          })
                      literal_load_uses.append({
                          **lit,
                          "instruction_set": mode_name,
                          "instruction_address": int(insn.address),
                          "instruction": f"{insn.mnemonic} {insn.op_str}".strip(),
                          "context": context,
                      })

          # Locate actual calls to the technology/context predicate.
          predicate_addr = 0x020957A0
          predicate_callers = []
          for component, path, base in components:
              blob = path.read_bytes()
              for mode_name, mode, align in (("arm", CS_MODE_ARM, 4), ("thumb", CS_MODE_THUMB, 2)):
                  md = Cs(CS_ARCH_ARM, mode | CS_MODE_LITTLE_ENDIAN)
                  md.detail = True
                  md.skipdata = True
                  insns = [i for i in md.disasm(blob, base) if i.id != 0 and i.address % align == 0]
                  for idx, insn in enumerate(insns):
                      if insn.mnemonic not in {"bl", "blx"}:
                          continue
                      ops = getattr(insn, "operands", ())
                      if not ops or ops[0].type != ARM_OP_IMM or int(ops[0].imm) != predicate_addr:
                          continue
                      context = [
                          {"address": int(i.address), "mnemonic": str(i.mnemonic), "operands": str(i.op_str), "is_call": i.address == insn.address}
                          for i in insns[max(0, idx-12):min(len(insns), idx+14)]
                      ]
                      predicate_callers.append({
                          "component": component,
                          "instruction_set": mode_name,
                          "call_address": int(insn.address),
                          "context": context,
                      })

          # Disassemble the special-condition helper called by the predicate.
          helper_start = 0x02095A20
          helper_end = 0x02095B40
          md = Cs(CS_ARCH_ARM, CS_MODE_ARM | CS_MODE_LITTLE_ENDIAN)
          md.skipdata = True
          helper = [
              {"address": int(i.address), "mnemonic": str(i.mnemonic), "operands": str(i.op_str)}
              for i in md.disasm(arm9[helper_start-arm9_base:helper_end-arm9_base], helper_start)
          ]

          payload = {
              "format_version": 1,
              "runtime_mapping": {
                  "base_address": runtime_base,
                  "id_0": records[0]["name"],
                  "id_1": records[1]["name"],
                  "id_47": records[47]["name"],
              },
              "records": records,
              "topology": topology,
              "topology_violations": violations,
              "reference_target_counts": [
                  {"runtime_id": k, "name": records[k]["name"], "count": v}
                  for k, v in sorted(ref_counts.items())
              ],
              "predicate": {
                  "address": predicate_addr,
                  "bitset_pointer_literal": 0x020957F8,
                  "bitset_array_address": predicate_bitset_ptr,
                  "callers": predicate_callers,
              },
              "interesting_globals": interesting_globals,
              "literal_words": literal_words,
              "literal_load_uses": literal_load_uses,
              "special_helper_02095a5c_window": helper,
          }
          Path("evidence/re/tech-semantics-resolution.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")

          earlier = sum(
              1 for row in topology for ref in row["references"] if ref["kind"] == "earlier_technology"
          )
          sentinel = sum(
              1 for row in topology for ref in row["references"] if "sentinel" in ref["kind"]
          )
          print(json.dumps({
              "runtime_mapping": payload["runtime_mapping"],
              "predecessor_reference_count": earlier,
              "sentinel_slot_count": sentinel,
              "topology_violation_count": len(violations),
              "topology_violations": violations,
              "predicate_bitset_array": hex(predicate_bitset_ptr),
              "predicate_callers": len(predicate_callers),
              "global_literal_words": len(literal_words),
              "global_literal_load_uses": len(literal_load_uses),
          }, sort_keys=True))
          PY
      - name: Commit semantics evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/tech-semantics-resolution.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: resolve technology dependency semantics [generated]"
          git push origin HEAD:analysis/civrev-tech-metadata-usage
