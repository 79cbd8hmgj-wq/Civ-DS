name: Civ Rev Unit Struct Resolution

on:
  push:
    branches:
      - analysis/civrev-unit-survey
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-unit-survey
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Resolve descriptor stride and metadata
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import struct
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9_path = workspace / "original" / "arm9.bin"
          arm9 = arm9_path.read_bytes()
          base = int(manifest["arm9_ram_address"])

          STRIDE = 0x94
          SLOT = 0x20
          META_OFFSET = 0x40
          META_SIZE = 0x14
          SLOT2_OFFSET = 0x54
          SLOT3_OFFSET = 0x74

          def unique(needle, label):
              hits=[]; p=0
              while True:
                  p=arm9.find(needle,p)
                  if p<0: break
                  hits.append(p); p+=1
              if len(hits)!=1:
                  raise RuntimeError(f"expected one {label}, got {len(hits)}")
              return hits[0]

          def text_slot(raw):
              nul=raw.find(b'\0')
              if nul < 0:
                  return None
              text=raw[:nul]
              if text and not all(0x20 <= b <= 0x7e for b in text):
                  return None
              if any(raw[nul+1:]):
                  return None
              return text.decode('ascii')

          start = unique(b"Settlers\0", "Settlers")
          start_addr = base + start

          # Validate known canonical names against exact 0x94 multiples.
          known = {
              0: "Settlers", 6: "Warrior", 7: "Militia", 8: "Legion", 9: "Archer",
              10: "Riflemen", 11: "Modern Infantry", 12: "Horsemen", 13: "Knights",
              14: "Tank", 15: "Phalanx", 16: "Catapult", 17: "Cannon", 18: "Artillery",
              19: "Submarine", 20: "Galley", 21: "Galleon", 22: "Cruiser",
              23: "Battleship", 25: "Bomber", 26: "Fighter", 29: "Caravan",
          }
          known_validation=[]
          for idx,name in sorted(known.items()):
              off=start+idx*STRIDE
              actual=arm9[off:off+SLOT].split(b'\0',1)[0].decode('ascii',errors='replace')
              known_validation.append({"index":idx,"expected":name,"actual":actual,"matches":actual==name,"address":base+off})
              if actual != name:
                  raise RuntimeError(f"0x94 stride failed at {idx}: expected {name}, got {actual!r}")

          records=[]
          first_invalid=None
          for idx in range(128):
              off=start+idx*STRIDE
              raw=arm9[off:off+STRIDE]
              if len(raw)!=STRIDE:
                  first_invalid={"index":idx,"reason":"truncated","address":base+off}
                  break
              slots=[
                  text_slot(raw[0x00:0x20]),
                  text_slot(raw[0x20:0x40]),
                  text_slot(raw[0x54:0x74]),
                  text_slot(raw[0x74:0x94]),
              ]
              # Descriptor strings may legitimately be empty, but all four slots must retain zero-padded text layout.
              if any(s is None for s in slots):
                  first_invalid={
                      "index":idx,"reason":"slot_validation_failed","address":base+off,
                      "slot_hex":[raw[0:0x20].hex(),raw[0x20:0x40].hex(),raw[0x54:0x74].hex(),raw[0x74:0x94].hex()],
                  }
                  break
              meta=raw[META_OFFSET:META_OFFSET+META_SIZE]
              records.append({
                  "index":idx,
                  "address":base+off,
                  "offset_from_settlers":idx*STRIDE,
                  "slot0":slots[0],"slot1":slots[1],"slot2":slots[2],"slot3":slots[3],
                  "metadata_hex":meta.hex(),
                  "metadata_u8":list(meta),
                  "metadata_s16":list(struct.unpack('<10h',meta)),
                  "metadata_u16":list(struct.unpack('<10H',meta)),
                  "metadata_u32":list(struct.unpack('<5I',meta)),
              })

          # Check per-byte metadata variability and common values across validated records.
          byte_columns=[]
          if records:
              for col in range(META_SIZE):
                  vals=[r['metadata_u8'][col] for r in records]
                  counts=Counter(vals)
                  byte_columns.append({
                      "offset":META_OFFSET+col,
                      "min":min(vals),"max":max(vals),"distinct":len(counts),
                      "most_common":[{"value":v,"count":c} for v,c in counts.most_common(8)],
                  })

          # Find exact aligned pointers to descriptor starts across ARM9+overlays.
          record_by_addr={r['address']:r for r in records}
          components=[('arm9',arm9_path,base)]
          for ov in manifest['overlays']:
              oid=int(ov['overlay_id'])
              components.append((f"overlay_{oid:03d}",workspace/'original'/'decoded'/'overlays'/f"overlay_{oid:03d}.bin",int(ov['ram_address'])))
          refs=[]
          ref_counts=Counter()
          for component,path,cbase in components:
              blob=path.read_bytes()
              for off in range(0,len(blob)-3,4):
                  value=int.from_bytes(blob[off:off+4],'little')
                  rec=record_by_addr.get(value)
                  if rec is None:
                      continue
                  refs.append({"component":component,"source_address":cbase+off,"source_offset":off,"record_index":rec['index'],"record_name":rec['slot0'],"target_address":value})
                  ref_counts[rec['index']]+=1

          payload={
              "format_version":1,
              "candidate_layout":{
                  "record_size":STRIDE,
                  "slot0":{"offset":0,"size":32},
                  "slot1":{"offset":32,"size":32},
                  "metadata":{"offset":64,"size":20},
                  "slot2":{"offset":84,"size":32},
                  "slot3":{"offset":116,"size":32},
              },
              "start_address":start_addr,
              "known_stride_validation":known_validation,
              "validated_record_count":len(records),
              "records":records,
              "first_invalid_record":first_invalid,
              "metadata_byte_columns":byte_columns,
              "record_start_pointer_refs":sorted(refs,key=lambda r:(r['component'],r['source_address'])),
              "record_start_xref_counts":[{"index":i,"name":records[i]['slot0'],"count":ref_counts[i]} for i in sorted(ref_counts)],
          }
          Path('evidence/re/unit-struct-resolution.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')

          print(json.dumps({
              "record_size":STRIDE,
              "validated_record_count":len(records),
              "first_invalid":first_invalid,
              "records":[{"i":r['index'],"s0":r['slot0'],"s1":r['slot1'],"meta":r['metadata_u8'],"s2":r['slot2'],"s3":r['slot3']} for r in records],
              "xref_counts":payload['record_start_xref_counts'],
          },sort_keys=True))
          PY
      - name: Commit unit struct evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/unit-struct-resolution.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "analysis: resolve 148-byte unit descriptor structure [generated]"
          git push origin HEAD:analysis/civrev-unit-survey
