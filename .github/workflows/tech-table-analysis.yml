name: Civ Rev Tech Text Table Analysis

on:
  push:
    branches:
      - analysis/civrev-executable-survey

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[tech-table-generated]') && !contains(github.event.head_commit.message, '[exec-survey-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-executable-survey
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Recover technology records and code references
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import struct
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN, CS_MODE_THUMB, Cs
          from capstone.arm import ARM_OP_MEM

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9_path = workspace / "original" / "arm9.bin"
          arm9 = arm9_path.read_bytes()
          arm9_base = int(manifest["arm9_ram_address"])

          RECORD_SIZE = 106
          NAME_SIZE = 32
          METADATA_OFFSET = 32
          METADATA_SIZE = 10
          EFFECT_OFFSET = 42
          EFFECT_SIZE = 64

          def unique_offset(blob: bytes, needle: bytes, label: str) -> int:
              found = []
              cursor = 0
              while True:
                  offset = blob.find(needle, cursor)
                  if offset < 0:
                      break
                  found.append(offset)
                  cursor = offset + 1
              if len(found) != 1:
                  raise RuntimeError(f"expected one {label} anchor, found {len(found)}")
              return found[0]

          def padded_ascii(slot: bytes, *, allow_empty: bool) -> str:
              nul = slot.find(b"\x00")
              if nul < 0:
                  raise RuntimeError("record text slot is not NUL-terminated")
              raw = slot[:nul]
              if not raw:
                  if not allow_empty:
                      raise RuntimeError("record name slot is empty")
                  text = ""
              else:
                  if not all(0x20 <= byte <= 0x7E for byte in raw):
                      raise RuntimeError("record text slot contains non-ASCII bytes")
                  text = raw.decode("ascii")
              if any(slot[nul + 1:]):
                  raise RuntimeError("record text slot has nonzero bytes after terminator")
              return text

          settlers_offset = unique_offset(arm9, b"Settlers\x00", "Settlers")
          alphabet_offset = unique_offset(arm9, b"Alphabet\x00", "Alphabet")
          distance = settlers_offset - alphabet_offset
          if distance <= 0 or distance % RECORD_SIZE:
              raise RuntimeError("Alphabet/Settlers anchors do not preserve the 106-byte stride")
          technology_count = distance // RECORD_SIZE
          if technology_count != 47:
              raise RuntimeError(f"expected 47 technology records from byte stride, found {technology_count}")

          prefix_count = 2
          block_start = alphabet_offset - prefix_count * RECORD_SIZE
          block_end = settlers_offset
          record_count = (block_end - block_start) // RECORD_SIZE
          if record_count != 49:
              raise RuntimeError(f"unexpected contiguous record count: {record_count}")

          records = []
          for physical_index in range(record_count):
              offset = block_start + physical_index * RECORD_SIZE
              raw = arm9[offset:offset + RECORD_SIZE]
              if len(raw) != RECORD_SIZE:
                  raise RuntimeError("technology record is truncated")
              name = padded_ascii(raw[:NAME_SIZE], allow_empty=False)
              metadata = list(struct.unpack_from("<5h", raw, METADATA_OFFSET))
              effect = padded_ascii(raw[EFFECT_OFFSET:], allow_empty=True)
              records.append({
                  "physical_index": physical_index,
                  "technology_ordinal": None if physical_index < prefix_count else physical_index - prefix_count,
                  "offset": offset,
                  "address": arm9_base + offset,
                  "name": name,
                  "metadata_s16": metadata,
                  "effect": effect,
                  "raw_hex": raw.hex(),
              })

          if [row["name"] for row in records[:3]] != ["on", "never", "Alphabet"]:
              raise RuntimeError("unexpected prefix/technology boundary")
          if records[-1]["name"] != "Future Technology":
              raise RuntimeError("technology block does not end at Future Technology")

          for row in records:
              resolved = []
              for value in row["metadata_s16"]:
                  resolved.append(
                      None
                      if value < 0 or value >= len(records)
                      else {
                          "physical_index": value,
                          "name": records[value]["name"],
                          "technology_ordinal": records[value]["technology_ordinal"],
                      }
                  )
              row["metadata_resolved_records"] = resolved

          metadata_columns = []
          for column in range(5):
              values = [row["metadata_s16"][column] for row in records[2:]]
              counts = Counter(values)
              metadata_columns.append({
                  "column": column,
                  "byte_offset": METADATA_OFFSET + column * 2,
                  "minimum": min(values),
                  "maximum": max(values),
                  "minus_one_count": counts[-1],
                  "distinct_values": [
                      {"value": value, "count": count}
                      for value, count in sorted(counts.items())
                  ],
              })

          components = [
              ("arm9", arm9_path, arm9_base),
          ]
          for overlay in manifest["overlays"]:
              overlay_id = int(overlay["overlay_id"])
              components.append((
                  f"overlay_{overlay_id:03d}",
                  workspace / "original" / "decoded" / "overlays" / f"overlay_{overlay_id:03d}.bin",
                  int(overlay["ram_address"]),
              ))

          target_by_address = {row["address"]: row for row in records}
          pointer_words = []
          pointer_locations_by_component = defaultdict(dict)
          for component_name, path, base in components:
              blob = path.read_bytes()
              for offset in range(0, len(blob) - 3, 4):
                  value = int.from_bytes(blob[offset:offset + 4], "little")
                  target = target_by_address.get(value)
                  if target is None:
                      continue
                  source_address = base + offset
                  entry = {
                      "component": component_name,
                      "source_offset": offset,
                      "source_address": source_address,
                      "target_address": value,
                      "target_physical_index": target["physical_index"],
                      "target_technology_ordinal": target["technology_ordinal"],
                      "target_name": target["name"],
                  }
                  pointer_words.append(entry)
                  pointer_locations_by_component[component_name][source_address] = entry

          literal_uses = []
          for component_name, path, base in components:
              blob = path.read_bytes()
              pointer_locations = pointer_locations_by_component[component_name]
              if not pointer_locations:
                  continue
              for mode_name, mode, alignment in (
                  ("arm", CS_MODE_ARM, 4),
                  ("thumb", CS_MODE_THUMB, 2),
              ):
                  engine = Cs(CS_ARCH_ARM, mode | CS_MODE_LITTLE_ENDIAN)
                  engine.detail = True
                  engine.skipdata = True
                  for instruction in engine.disasm(blob, base):
                      if instruction.id == 0 or instruction.address % alignment:
                          continue
                      operands = getattr(instruction, "operands", ())
                      if len(operands) < 2 or operands[1].type != ARM_OP_MEM:
                          continue
                      memory = operands[1].mem
                      if instruction.reg_name(memory.base) != "pc" or memory.index != 0:
                          continue
                      pc = instruction.address + 8 if mode_name == "arm" else (instruction.address + 4) & ~3
                      literal_address = (pc + int(memory.disp)) & 0xFFFFFFFF
                      pointer = pointer_locations.get(literal_address)
                      if pointer is None:
                          continue

                      start_offset = instruction.address - base
                      context_engine = Cs(CS_ARCH_ARM, mode | CS_MODE_LITTLE_ENDIAN)
                      context = [
                          {
                              "address": int(item.address),
                              "size": int(item.size),
                              "mnemonic": str(item.mnemonic),
                              "operands": str(item.op_str),
                          }
                          for item in context_engine.disasm(
                              blob[start_offset:start_offset + 96],
                              instruction.address,
                              count=20,
                          )
                      ]
                      literal_uses.append({
                          "component": component_name,
                          "instruction_set": mode_name,
                          "instruction_address": int(instruction.address),
                          "instruction": f"{instruction.mnemonic} {instruction.op_str}".strip(),
                          "literal_address": literal_address,
                          "target_address": pointer["target_address"],
                          "target_physical_index": pointer["target_physical_index"],
                          "target_technology_ordinal": pointer["target_technology_ordinal"],
                          "target_name": pointer["target_name"],
                          "forward_context": context,
                      })

          pointer_words.sort(key=lambda row: (row["component"], row["source_address"], row["target_address"]))
          literal_uses.sort(key=lambda row: (row["component"], row["instruction_address"], row["instruction_set"]))

          payload = {
              "format_version": 3,
              "component": "arm9",
              "component_base": arm9_base,
              "layout": {
                  "record_size": RECORD_SIZE,
                  "name": {"offset": 0, "size": NAME_SIZE, "encoding": "ascii-nul-zero-padded"},
                  "metadata": {"offset": METADATA_OFFSET, "size": METADATA_SIZE, "encoding": "5 x little-endian signed int16", "semantic_names_confirmed": False},
                  "effect": {"offset": EFFECT_OFFSET, "size": EFFECT_SIZE, "encoding": "ascii-nul-zero-padded"},
              },
              "contiguous_block": {
                  "start_offset": block_start,
                  "start_address": arm9_base + block_start,
                  "end_offset": block_end,
                  "end_address": arm9_base + block_end,
                  "record_count": record_count,
                  "prefix_candidate_count": prefix_count,
                  "technology_count": technology_count,
                  "boundary_after": "Settlers",
              },
              "prefix_candidates": records[:prefix_count],
              "technologies": records[prefix_count:],
              "metadata_columns": metadata_columns,
              "pointer_words": pointer_words,
              "literal_load_uses": literal_uses,
          }
          Path("evidence/re/tech-text-table.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "technology_count": technology_count,
              "block_start": hex(arm9_base + block_start),
              "alphabet": hex(arm9_base + alphabet_offset),
              "future_technology": hex(records[-1]["address"]),
              "pointer_word_count": len(pointer_words),
              "literal_load_use_count": len(literal_uses),
              "effect_records": [row["name"] for row in records[2:] if row["effect"]],
              "metadata_columns": [
                  {
                      "column": row["column"],
                      "min": row["minimum"],
                      "max": row["maximum"],
                      "minus_one": row["minus_one_count"],
                  }
                  for row in metadata_columns
              ],
          }, sort_keys=True))
          PY
      - name: Commit derived tech table evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/tech-text-table.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: resolve technology record layout and xrefs [tech-table-generated]"
          git push origin HEAD:analysis/civrev-executable-survey
