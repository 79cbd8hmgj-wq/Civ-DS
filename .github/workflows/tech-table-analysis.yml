name: Civ Rev Tech Text Table Analysis

on:
  push:
    branches:
      - analysis/civrev-executable-survey

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[tech-table-generated]') && !contains(github.event.head_commit.message, '[exec-survey-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-executable-survey
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Recover fixed-stride tech text records
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9_path = workspace / "original" / "arm9.bin"
          data = arm9_path.read_bytes()
          base = int(manifest["arm9_ram_address"])

          anchor = b"Settlers\x00"
          matches = []
          cursor = 0
          while True:
              found = data.find(anchor, cursor)
              if found < 0:
                  break
              matches.append(found)
              cursor = found + 1
          if len(matches) != 1:
              raise RuntimeError(f"expected exactly one Settlers anchor, found {len(matches)}")
          settlers_offset = matches[0]

          RECORD_SIZE = 106
          NAME_WINDOW = 42
          EFFECT_OFFSET = 42

          def c_string_at(blob: bytes, offset: int, limit: int):
              if offset < 0 or offset >= len(blob):
                  return None
              end_limit = min(len(blob), offset + limit)
              nul = blob.find(b"\x00", offset, end_limit)
              if nul < 0:
                  return None
              raw = blob[offset:nul]
              if not raw or not all(0x20 <= byte <= 0x7e for byte in raw):
                  return None
              return raw.decode("ascii")

          def printable_runs(blob: bytes):
              return [
                  {
                      "offset": match.start(),
                      "end_offset": match.end(),
                      "text": match.group().decode("ascii"),
                  }
                  for match in re.finditer(rb"[ -~]{2,}", blob)
              ]

          def nonzero_ranges(blob: bytes):
              ranges = []
              start = None
              for index, value in enumerate(blob):
                  if value != 0 and start is None:
                      start = index
                  elif value == 0 and start is not None:
                      ranges.append({
                          "start": start,
                          "end": index,
                          "hex": blob[start:index].hex(),
                      })
                      start = None
              if start is not None:
                  ranges.append({
                      "start": start,
                      "end": len(blob),
                      "hex": blob[start:].hex(),
                  })
              return ranges

          # The observed names are exactly 106 bytes apart. Walk backward from the
          # Settlers boundary using only the invariant actually proven by bytes:
          # each candidate begins with a printable, NUL-terminated name within the
          # first 42 bytes. Do not assume unused bytes are zero-filled.
          records_reversed = []
          cursor = settlers_offset - RECORD_SIZE
          rejected_before = None
          while cursor >= 0:
              record = data[cursor:cursor + RECORD_SIZE]
              if len(record) != RECORD_SIZE:
                  break
              name = c_string_at(record, 0, NAME_WINDOW)
              if name is None:
                  rejected_before = {
                      "offset": cursor,
                      "address": base + cursor,
                      "raw_hex": record.hex(),
                      "printable_runs": printable_runs(record),
                  }
                  break
              effect = c_string_at(record, EFFECT_OFFSET, RECORD_SIZE - EFFECT_OFFSET)
              records_reversed.append(
                  {
                      "offset": cursor,
                      "address": base + cursor,
                      "name": name,
                      "effect_at_42": effect,
                      "raw_hex": record.hex(),
                      "printable_runs": printable_runs(record),
                      "nonzero_ranges": nonzero_ranges(record),
                  }
              )
              cursor -= RECORD_SIZE

          records = list(reversed(records_reversed))
          if not records:
              raise RuntimeError("no 106-byte name records found before Settlers")

          for index, record in enumerate(records):
              record["index"] = index

          effect_offsets = {}
          for record in records:
              for run in record["printable_runs"]:
                  offset = run["offset"]
                  if offset == 0:
                      continue
                  effect_offsets[str(offset)] = effect_offsets.get(str(offset), 0) + 1

          payload = {
              "format_version": 2,
              "component": "arm9",
              "component_base": base,
              "record_size": RECORD_SIZE,
              "observed_name_window": NAME_WINDOW,
              "candidate_effect_offset": EFFECT_OFFSET,
              "table_start_offset": records[0]["offset"],
              "table_start_address": records[0]["address"],
              "table_end_offset": settlers_offset,
              "table_end_address": base + settlers_offset,
              "record_count": len(records),
              "boundary_after": {
                  "offset": settlers_offset,
                  "address": base + settlers_offset,
                  "ascii": "Settlers",
              },
              "rejected_record_before_start": rejected_before,
              "secondary_printable_offset_counts": effect_offsets,
              "records": records,
          }
          Path("evidence/re/tech-text-table.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "record_count": payload["record_count"],
              "start": hex(payload["table_start_address"]),
              "end": hex(payload["table_end_address"]),
              "first": records[0]["name"],
              "last": records[-1]["name"],
              "effect_at_42_count": sum(record["effect_at_42"] is not None for record in records),
              "secondary_offsets": effect_offsets,
          }, sort_keys=True))
          PY
      - name: Commit derived tech table evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/tech-text-table.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: recover fixed-stride tech text table [tech-table-generated]"
          git push origin HEAD:analysis/civrev-executable-survey
