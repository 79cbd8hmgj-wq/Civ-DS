name: Civ Rev Tech Text Table Analysis

on:
  push:
    branches:
      - analysis/civrev-executable-survey

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[tech-table-generated]') && !contains(github.event.head_commit.message, '[exec-survey-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-executable-survey
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Recover fixed-stride tech text records
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          arm9_path = workspace / "original" / "arm9.bin"
          data = arm9_path.read_bytes()
          base = int(manifest["arm9_ram_address"])

          anchor = b"Settlers\x00"
          matches = []
          cursor = 0
          while True:
              found = data.find(anchor, cursor)
              if found < 0:
                  break
              matches.append(found)
              cursor = found + 1
          if len(matches) != 1:
              raise RuntimeError(f"expected exactly one Settlers anchor, found {len(matches)}")
          settlers_offset = matches[0]

          RECORD_SIZE = 106
          NAME_SIZE = 42
          EFFECT_SIZE = 64

          def decode_field(field: bytes):
              nul = field.find(b"\x00")
              if nul < 0:
                  return None
              raw = field[:nul]
              if not raw:
                  text = ""
              else:
                  if not all(0x20 <= byte <= 0x7e for byte in raw):
                      return None
                  text = raw.decode("ascii")
              if any(field[nul + 1:]):
                  return None
              return text

          records_reversed = []
          cursor = settlers_offset - RECORD_SIZE
          while cursor >= 0:
              record = data[cursor:cursor + RECORD_SIZE]
              if len(record) != RECORD_SIZE:
                  break
              name = decode_field(record[:NAME_SIZE])
              effect = decode_field(record[NAME_SIZE:])
              if name is None or effect is None or not name:
                  break
              records_reversed.append((cursor, name, effect))
              cursor -= RECORD_SIZE

          records = list(reversed(records_reversed))
          if not records:
              raise RuntimeError("no fixed-stride tech text records found before Settlers")

          payload = {
              "format_version": 1,
              "component": "arm9",
              "component_base": base,
              "record_size": RECORD_SIZE,
              "field_layout": [
                  {"name": "name", "offset": 0, "size": NAME_SIZE, "encoding": "ascii-nul-padded"},
                  {"name": "effect", "offset": NAME_SIZE, "size": EFFECT_SIZE, "encoding": "ascii-nul-padded"},
              ],
              "table_start_offset": records[0][0],
              "table_start_address": base + records[0][0],
              "table_end_offset": settlers_offset,
              "table_end_address": base + settlers_offset,
              "record_count": len(records),
              "boundary_after": {
                  "offset": settlers_offset,
                  "address": base + settlers_offset,
                  "ascii": "Settlers",
              },
              "records": [
                  {
                      "index": index,
                      "offset": offset,
                      "address": base + offset,
                      "name": name,
                      "effect": effect,
                  }
                  for index, (offset, name, effect) in enumerate(records)
              ],
          }
          Path("evidence/re/tech-text-table.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "record_count": payload["record_count"],
              "start": hex(payload["table_start_address"]),
              "end": hex(payload["table_end_address"]),
              "first": records[0][1],
              "last": records[-1][1],
          }, sort_keys=True))
          PY
      - name: Commit derived tech table evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/tech-text-table.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: recover fixed-stride tech text table [tech-table-generated]"
          git push origin HEAD:analysis/civrev-executable-survey
