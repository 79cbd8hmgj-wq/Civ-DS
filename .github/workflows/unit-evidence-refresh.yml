name: Refresh unit evidence

on:
  push:
    paths:
      - src/civds/units.py
      - src/civds/unit_summary.py
      - tests/test_units.py
      - tests/test_cli.py
      - .github/workflows/unit-evidence-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Extract exact ROM
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip")
          destination = Path("/tmp/civrev")
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zipped:
              zipped.extractall(destination)
          roms = list(destination.rglob("*.nds"))
          if len(roms) != 1:
              raise SystemExit(f"expected exactly one NDS ROM, found {len(roms)}")
          Path("/tmp/civrev-rom-path").write_text(str(roms[0]), encoding="utf-8")
          PY
      - name: Regenerate canonical unit evidence
        shell: bash
        run: |
          ROM="$(cat /tmp/civrev-rom-path)"
          python -m civds units summarize "$ROM" \
            --profile profiles/civrev-us.json \
            --output evidence/re/units.json
      - name: Commit refreshed evidence
        shell: bash
        run: |
          if git diff --quiet -- evidence/re/units.json; then
            echo "Canonical unit evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/units.json
          git commit -m "data: refresh recovered unit evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
