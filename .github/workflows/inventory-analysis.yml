name: Civ Rev Inventory Analysis

on:
  push:
    branches:
      - analysis/civrev-inventory

permissions:
  contents: write

jobs:
  summarize:
    if: ${{ !contains(github.event.head_commit.message, '[inventory-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-inventory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Generate inventory summary
        run: |
          civds inventory summarize \
            evidence/baseline/files.json \
            evidence/baseline/assets.json \
            --output evidence/baseline/inventory-summary.json
      - name: Commit generated summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/baseline/inventory-summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: summarize Civ Rev NitroFS inventory [inventory-generated]"
          git push origin HEAD:analysis/civrev-inventory
