name: Civ Rev Executable Survey

on:
  push:
    branches:
      - analysis/civrev-executable-survey

permissions:
  contents: write

jobs:
  survey:
    if: ${{ !contains(github.event.head_commit.message, '[exec-survey-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/civrev-executable-survey
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Civ-DS
        run: python -m pip install -e '.[dev]'
      - name: Survey ARM9 and overlays
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP="SidMeier'sCivilizationRevolution(USA)(En,Fr,De,Es,It).zip"
          ROM_DIR="$RUNNER_TEMP/civrev-rom"
          WORK_DIR="$RUNNER_TEMP/civrev-work"
          mkdir -p "$ROM_DIR" evidence/re
          unzip -q "$ROM_ZIP" -d "$ROM_DIR"
          ROM="$(find "$ROM_DIR" -type f -iname '*.nds' -print -quit)"
          test -n "$ROM"
          civds extract "$ROM" "$WORK_DIR"

          python - "$WORK_DIR" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])
          manifest = json.loads((workspace / "manifests" / "workspace.json").read_text())
          cmd = [
              "civds",
              "analyze",
              "--component",
              "arm9",
              str(workspace / "original" / "arm9.bin"),
              hex(manifest["arm9_ram_address"]),
          ]
          for overlay in manifest["overlays"]:
              overlay_id = int(overlay["overlay_id"])
              cmd += [
                  "--component",
                  f"overlay_{overlay_id:03d}",
                  str(workspace / "original" / "decoded" / "overlays" / f"overlay_{overlay_id:03d}.bin"),
                  hex(int(overlay["ram_address"])),
              ]

          keywords = [
              "gold", "trade", "food", "production", "science", "culture", "resource",
              "treasury", "technology", "research", "tech", "population", "building",
              "wonder", "combat", "attack", "defense", "damage", "army", "unit", "veteran",
              "diplomacy", "diplomatic", "treaty", "peace", "government", "democracy",
              "monarchy", "republic", "communism", "fundamentalism", "despotism",
              "civilization", "leader", "victory", "defeat", "barbarian", "settler",
              "save", "autosave", "profile", "CvCity", "CvUnit", "CvPlayer", "CvGame",
              "CvTeam", "CvMap", "CvPlot", "CvInfo", "GameCore", "Firaxis",
              "assert", "invalid", "failed", "error",
          ]
          for keyword in keywords:
              cmd += ["--keyword", keyword]
          cmd += [
              "--minimum-string-length", "5",
              "--output", "evidence/re/executable-keywords.json",
          ]
          subprocess.run(cmd, check=True)
          PY
      - name: Commit derived survey
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/re/executable-keywords.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analysis: add Civ Rev executable keyword survey [exec-survey-generated]"
          git push origin HEAD:analysis/civrev-executable-survey
