[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "civds"
version = "0.1.0"
description = "Evidence-first Nintendo DS inspection tooling"
requires-python = ">=3.10"
[project.scripts]
civds = "civds.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.mypy]
strict = true
[tool.ruff]
line-length = 100
