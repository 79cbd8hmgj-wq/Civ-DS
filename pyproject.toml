[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "civds"
version = "0.1.0"
description = "Evidence-first Nintendo DS inspection tooling"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
]
[project.scripts]
civds = "civds.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"civds.data" = ["*.json"]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["reference_rom: requires the exact local copyrighted reference ROM"]
[tool.mypy]
strict = true
[tool.ruff]
line-length = 100
